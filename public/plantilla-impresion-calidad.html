<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reporte de Calidad - Impresión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3F51B5;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --bg-light: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 10px;
            background: #fff;
            line-height: 1.3;
            font-size: 11px;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* Utilidades de impresión */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; font-size: 11px; }
            .container { max-width: 100%; width: 100%; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            /* Forzar fondos */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Layout & Componentes */
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header-logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 30%;
        }

        .header-title-area {
            text-align: center;
            flex: 1;
        }

        .header-title-area h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .header-title-area p {
            margin: 4px 0 0;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-meta-area {
            text-align: right;
            width: 30%;
        }

        .report-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
        }

        .report-date {
            font-size: 10px;
            color: var(--text-muted);
            margin: 4px 0 0;
        }

        /* Secciones */
        .section {
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .section-header {
            background: var(--bg-light);
            padding: 6px 12px;
            font-weight: 700;
            font-size: 11px;
            border-bottom: 1px solid var(--border);
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .section-content {
            padding: 10px 12px;
        }

        /* Grid de Datos */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .data-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .data-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }

        .data-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .data-label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .data-value {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            word-break: break-word;
        }

        /* Conclusión Especial */
        .conclusion-card {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            gap: 15px;
        }

        .conclusion-badge {
            padding: 0;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .conclusion-badge.aprobado { color: #166534; }
        .conclusion-badge.rechazado { color: #991b1b; }

        .destino-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-left: 2px solid rgba(0,0,0,0.1);
            padding-left: 15px;
        }

        /* Novedades Table */
        .nov-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }

        .nov-table th, .nov-table td {
            border: 1px solid var(--border);
            padding: 4px 8px;
            text-align: left;
        }

        .nov-table th {
            font-weight: 700;
            color: var(--text-muted);
            background: #f1f5f9;
            text-transform: uppercase;
            font-size: 9px;
        }

        .nov-table td {
            font-weight: 500;
        }
        
        .nov-table .text-right { text-align: right; }
        .nov-table .text-center { text-align: center; }

        .group-header {
            padding: 6px 8px;
            font-weight: 800;
            font-size: 10px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px 4px 0 0;
        }

        .group-wrapper {
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            page-break-inside: avoid;
        }

        .obs-box {
            background: #f1f5f9;
            padding: 15px 18px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            border-left: 4px solid var(--primary);
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.5;
            white-space: pre-wrap;
            color: var(--text-dark);
        }

        /* Firmas y Soportes */
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            page-break-inside: avoid;
        }

        .soporte-img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border: 1px dashed #cbd5e1;
            border-radius: 4px;
            background: #f8fafc;
        }

        .zoom-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .zoom-container:hover .zoom-overlay {
            opacity: 1 !important;
        }

        @media print {
            .zoom-overlay {
                display: none !important;
            }
        }

        .firma-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 200px;
            border: 1px dashed #cbd5e1;
            border-radius: 4px;
            padding: 10px;
            background: #f8fafc;
            position: relative;
        }

        .firma-svg {
            max-width: 100%;
            max-height: 120px;
            margin-bottom: 10px;
        }

        .firma-line {
            width: 80%;
            border-top: 1px solid #1e293b;
            margin: 10px 0 5px;
        }

        /* UI Elements */
        .btn-print {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .btn-print-action {
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-print-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
            filter: brightness(1.05);
        }
        .btn-print-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>
    <!-- Skeleton Loader -->
    <div id="loadingIndicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; padding: 20px;">
        <div style="max-width: 850px; width: 100%;">
            <!-- Header Skeleton -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="width: 30%;">
                    <div class="skeleton-box" style="height: 42px; width: 42px; border-radius: 50%; margin-bottom: 8px;"></div>
                    <div class="skeleton-box" style="height: 12px; width: 80%;"></div>
                </div>
                <div style="flex: 1; text-align: center;">
                    <div class="skeleton-box" style="height: 18px; width: 60%; margin: 0 auto 6px;"></div>
                    <div class="skeleton-box" style="height: 11px; width: 40%; margin: 0 auto;"></div>
                </div>
                <div style="width: 30%; text-align: right;">
                    <div class="skeleton-box" style="height: 15px; width: 60%; margin-left: auto;"></div>
                    <div class="skeleton-box" style="height: 10px; width: 40%; margin-left: auto; margin-top: 4px;"></div>
                </div>
            </div>
            <!-- Conclusion Card Skeleton -->
            <div class="skeleton-box" style="height: 60px; margin-bottom: 15px; border-radius: 6px;"></div>
            <!-- Section Skeleton -->
            <div class="skeleton-box" style="height: 120px; margin-bottom: 15px; border-radius: 6px;"></div>
            <!-- Geoloc/Evidence Skeleton -->
            <div class="skeleton-box" style="height: 200px; margin-bottom: 15px; border-radius: 6px;"></div>
            <!-- Observations Skeleton -->
            <div class="skeleton-box" style="height: 80px; margin-bottom: 15px; border-radius: 6px;"></div>
            <!-- Signatures Skeleton -->
            <div class="skeleton-box" style="height: 200px; border-radius: 6px;"></div>
        </div>
        <style>
            .skeleton-box {
                background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite;
            }
            @keyframes shimmer {
                0% { background-position: 200% 0; }
                100% { background-position: -200% 0; }
            }
        </style>
    </div>

    <div class="container" id="reporteContenedor">
        <!-- Renderizado Dinámico -->
    </div>

    <!-- Panel de Botones Flotantes Moderno -->
    <div class="print-btn-area no-print" style="position: fixed; bottom: 20px; right: 20px; display: flex; gap: 12px; z-index: 10000;">
        <button class="btn-print-action" onclick="window.print()" style="background: #3F51B5; color: white;">
            <i class="fas fa-print"></i> Imprimir / Guardar PDF
        </button>
    </div>

    <!-- Scripts externos cargados al final para no bloquear renderizado -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        function formatearFecha(dateString) {
            if (!dateString) return 'N/A';
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleString('es-CO', { 
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: true 
                });
            } catch(e) { return dateString; }
        }

        function renderNovedadesAuditoria(jsonString) {
            if (!jsonString) return '<p style="color:var(--text-muted); font-style:italic; margin:0;">No se registraron novedades cuantitativas.</p>';
            
            try {
                let parsed = jsonString;
                // Manejar doble escape
                if (typeof parsed === 'string') { parsed = JSON.parse(parsed); }
                if (typeof parsed === 'string') { parsed = JSON.parse(parsed); }

                if (!Array.isArray(parsed) || parsed.length === 0) {
                    return '<p style="color:var(--text-muted); font-style:italic; margin:0;">No se registraron novedades cuantitativas.</p>';
                }

                let html = '';
                parsed.forEach(novedad => {
                    const totalUnidades = novedad.codigos.reduce((sum, c) => sum + (Number(c.cantidad)||0), 0);
                    
                    let bgColor = '#3b82f6';
                    let iconName = 'fa-tag';
                    let displayTipo = novedad.tipo;
                    
                    if (novedad.tipo === 'SIN CONFECCIONAR') { bgColor = '#ef4444'; iconName = 'fa-cut'; }
                    if (novedad.tipo === 'PROMOCIONES') { 
                        if (novedad.sin_proceso) {
                            bgColor = '#db2777'; 
                            iconName = 'fa-exclamation-triangle';
                            displayTipo = 'PROM. SIN PROCESO';
                        } else {
                            bgColor = '#f59e0b'; 
                            iconName = 'fa-percentage'; 
                        }
                    }
                    if (novedad.tipo === 'COBROS') { bgColor = '#10b981'; iconName = 'fa-file-invoice-dollar'; }
                    if (novedad.tipo === 'LAVADO') { bgColor = '#6366f1'; iconName = 'fa-water'; }

                    html += `
                        <div class="group-wrapper">
                            <div class="group-header" style="background-color: ${bgColor};">
                                <div><i class="fas ${iconName}" style="margin-right:6px;"></i> ${displayTipo}</div>
                                <div>${totalUnidades} UNDS.</div>
                            </div>
                            <table class="nov-table">
                                <thead>
                                    <tr>
                                        <th style="width:40%">TALLA</th>
                                        <th style="width:40%">COLOR</th>
                                        <th style="width:20%" class="text-right">CANTIDAD</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    novedad.codigos.forEach(c => {
                        html += `
                            <tr>
                                <td>${c.talla || '-'}</td>
                                <td>${c.color || '-'}</td>
                                <td class="text-right">${c.cantidad || '0'}</td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                });

                return html;
            } catch (e) {
                console.error("Error parseando novedades_auditoria", e);
                return `<p style="color:#ef4444; font-size:10px;">Error al leer novedades de auditoría.</p>`;
            }
        }

        // Caché simple para datos de planta
        const plantaCache = new Map();

        async function obtenerDatosPlanta(plantaNombre) {
            if (!plantaNombre) return { nombre: 'N/A', cedula: 'N/A' };
            
            // Verificar caché primero
            const cacheKey = plantaNombre.trim().toLowerCase();
            if (plantaCache.has(cacheKey)) {
                return plantaCache.get(cacheKey);
            }
            
            try {
                const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaWtqamNiaWV2ZnB6ZWd1cG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzU1NDEsImV4cCI6MjA5MjQ1MTU0MX0.HJxSSIcUSVrf5IAsjwnkf3eq0xZobchtlg1k_iFjW_g";
                const sb = supabase.createClient("https://zpikjjcbievfpzegupmw.supabase.co", SUPABASE_KEY);
                const { data, error } = await sb.from('plantas').select('id_planta, planta').ilike('planta', plantaNombre.trim()).single();
                if (error) {
                    const { data: dataEq, error: errorEq } = await sb.from('plantas').select('id_planta, planta').eq('planta', plantaNombre.trim()).single();
                    if (errorEq) throw errorEq;
                    const result = { nombre: dataEq?.planta || plantaNombre, cedula: dataEq?.id_planta || 'N/A' };
                    plantaCache.set(cacheKey, result);
                    return result;
                }
                const result = { nombre: data?.planta || plantaNombre, cedula: data?.id_planta || 'N/A' };
                plantaCache.set(cacheKey, result);
                return result;
            } catch(e) {
                console.error("Error al obtener datos de la planta:", e);
                const result = { nombre: plantaNombre, cedula: 'N/A' };
                plantaCache.set(cacheKey, result);
                return result;
            }
        }

        // Caché simple para datos de auditor
        const auditorCache = new Map();

        async function obtenerDatosAuditor(email) {
            if (!email) return { nombre: 'N/A', cedula: 'N/A', firmaSvg: null };
            
            // Verificar caché primero
            const cacheKey = String(email).toLowerCase();
            if (auditorCache.has(cacheKey)) {
                return auditorCache.get(cacheKey);
            }
            
            try {
                const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaWtqamNiaWV2ZnB6ZWd1cG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzU1NDEsImV4cCI6MjA5MjQ1MTU0MX0.HJxSSIcUSVrf5IAsjwnkf3eq0xZobchtlg1k_iFjW_g";
                const response = await fetch("https://zpikjjcbievfpzegupmw.supabase.co/functions/v1/operations", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'apikey': SUPABASE_KEY
                    },
                    body: JSON.stringify({ accion: 'RESOLVER_USUARIOS_LOGIN' })
                });
                if (!response.ok) throw new Error('Error HTTP ' + response.status);
                const result = await response.json();
                const users = result.users || [];
                const foundUser = users.find(u => String(u.CORREO || '').toLowerCase() === String(email).toLowerCase());
                let auditorResult;
                if (foundUser) {
                    auditorResult = {
                        nombre: foundUser.NOMBRE || email.split('@')[0].replace(/[^a-zA-Z0-9]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
                        cedula: foundUser.ID_USUARIO || 'N/A',
                        firmaSvg: foundUser.FIRMA_SVG || null
                    };
                } else {
                    const username = email.split('@')[0].replace(/[^a-zA-Z0-9]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    auditorResult = { nombre: username, cedula: 'N/A', firmaSvg: null };
                }
                auditorCache.set(cacheKey, auditorResult);
                return auditorResult;
            } catch(e) {
                console.error("Error al obtener datos de auditor:", e);
                const username = email.split('@')[0].replace(/[^a-zA-Z0-9]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                const auditorResult = { nombre: username, cedula: 'N/A', firmaSvg: null };
                auditorCache.set(cacheKey, auditorResult);
                return auditorResult;
            }
        }

        // Caché simple para datos de productora
        const productoraCache = new Map();

        async function obtenerNombreProductora(productoraId) {
            if (!productoraId) return 'N/A';
            
            // Verificar caché primero
            const cacheKey = String(productoraId);
            if (productoraCache.has(cacheKey)) {
                return productoraCache.get(cacheKey);
            }
            
            try {
                const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaWtqamNiaWV2ZnB6ZWd1cG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzU1NDEsImV4cCI6MjA5MjQ1MTU0MX0.HJxSSIcUSVrf5IAsjwnkf3eq0xZobchtlg1k_iFjW_g";
                const sb = supabase.createClient("https://zpikjjcbievfpzegupmw.supabase.co", SUPABASE_KEY);
                const { data, error } = await sb.from('productoras').select('productora').eq('id_productora', parseInt(productoraId)).single();
                if (error) throw error;
                const result = data?.productora || 'N/A';
                productoraCache.set(cacheKey, result);
                return result;
            } catch(e) {
                console.error("Error al obtener productora:", e);
                const result = 'N/A';
                productoraCache.set(cacheKey, result);
                return result;
            }
        }

        function abrirImagenGrande(src) {
            if (!src) return;
            const modal = document.createElement('div');
            modal.id = 'imagenGrandeModal';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100vw';
            modal.style.height = '100vh';
            modal.style.backgroundColor = 'rgba(15, 23, 42, 0.9)';
            modal.style.backdropFilter = 'blur(8px)';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.style.zIndex = '99999';
            modal.style.cursor = 'zoom-out';
            modal.style.opacity = '0';
            modal.style.transition = 'opacity 0.25s ease';

            modal.innerHTML = `
                <div style="position: relative; max-width: 90%; max-height: 90%; display: flex; align-items: center; justify-content: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
                    <img src="${src}" style="max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; border: 3px solid rgba(255,255,255,0.1);">
                    <button style="position: absolute; top: -45px; right: 0; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 18px; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.4)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            modal.onclick = () => {
                modal.style.opacity = '0';
                setTimeout(() => modal.remove(), 250);
            };

            document.body.appendChild(modal);
            setTimeout(() => {
                modal.style.opacity = '1';
            }, 10);
        }

        async function init() {
            try {
                const dataRaw = localStorage.getItem('printReporteCalidad');
                if (!dataRaw) {
                    document.body.innerHTML = '<h2 style="padding:20px; text-align:center; color:#ef4444;">No hay datos para imprimir. Por favor genere el reporte desde el sistema.</h2>';
                    return;
                }

                // El backend/localstorage devuelve un array o un objeto
                let rep = JSON.parse(dataRaw);
                if (Array.isArray(rep)) rep = rep[0]; // Si es array tomar el primero
                
                if (!rep) throw new Error("Datos vacíos");

                                <div style="height: 100px; display: flex; align-items: center; justify-content: center; width: 100%;">
                                    ${rep.firma_svg ? rep.firma_svg.replace(/<svg/g, '<svg class="firma-svg" style="max-height: 80px; width: auto;"') : '<span style="color:#94a3b8; font-style:italic; font-size: 10px;">Sin firma registrada</span>'}
                                </div>
                                <div style="width: 80%; height: 1px; background: #94a3b8; margin: 8px 0 4px;"></div>
                                <span style="font-size: 11px; font-weight: 700; color: var(--text-dark); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;">${plantaDatos.nombre}</span>
                                <span style="font-size: 9px; font-weight: 600; color: var(--text-muted);">C.C. / NIT: ${plantaDatos.cedula}</span>
                            </div>
                        </div>
                    </div>
                `;

                contenedor.innerHTML = html;

                // Ocultar indicador de carga
                const loadingIndicator = document.getElementById('loadingIndicator');
                if (loadingIndicator) {
                    loadingIndicator.style.opacity = '0';
                    setTimeout(() => loadingIndicator.remove(), 300);
                }

                // Auto-imprimir pasados unos ms si es necesario, o dejar que el usuario presione el botón.
                // setTimeout(() => window.print(), 1000);

            } catch (err) {
                console.error(err);
                const loadingIndicator = document.getElementById('loadingIndicator');
                if (loadingIndicator) loadingIndicator.remove();
                document.body.innerHTML = `<h2 style="padding:20px; text-align:center; color:#ef4444;">Error al cargar datos del reporte: ${err.message}</h2>`;
            }
        }

        async function descargarComoPDFCanvas() {
            const btn = document.getElementById('btnDescargarPDFCanvas');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando PDF...';
            
            // Guardar los estados de geolocalización originales para restaurarlos luego
            const mapContainers = document.querySelectorAll('.map-container-dynamic');
            const savedMapStates = [];
            
            try {
                const element = document.getElementById('reporteContenedor');
                if (!element) {
                    alert('Error: No se pudo encontrar el contenedor del reporte.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    return;
                }
                
                // 1. Intercambiar temporalmente iframes de Google Maps por imágenes estáticas de Yandex Maps para que html2canvas las dibuje
                for (const container of mapContainers) {
                    const iframe = container.querySelector('iframe');
                    if (iframe) {
                        const coords = String(window.printData?.localizacion || '').split(',');
                        const lat = coords[0]?.trim();
                        const lon = coords[1]?.trim();
                        if (lat && lon) {
                            const staticMapUrl = `https://static-maps.yandex.ru/1.x/?ll=${lon},${lat}&z=16&l=map&size=650,300&pt=${lon},${lat},pm2rdl`;
                            
                            // Guardar estado original
                            savedMapStates.push({
                                container: container,
                                originalHTML: container.innerHTML
                            });
                            
                            // Reemplazar con imagen estática temporal
                            container.innerHTML = `<img src="${staticMapUrl}" style="width:100%; height:100%; object-fit:cover; border:none;" alt="Mapa de geolocalización">`;
                        }
                    }
                }
                
                // Esperar 200ms para asegurar que las imágenes estáticas del mapa se carguen en memoria antes del canvas
                await new Promise(resolve => setTimeout(resolve, 200));

                // Limpiar sombras y ajustar fondo para el corte perfecto
                const originalBoxShadow = element.style.boxShadow;
                const originalMargin = element.style.margin;
                const originalPadding = element.style.padding;
                
                element.style.boxShadow = 'none';
                element.style.margin = '0';
                element.style.padding = '4px';
                element.style.background = '#ffffff';
                
                const canvas = await html2canvas(element, {
                    scale: 2.5,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff',
                    logging: false
                });
                
                // Restaurar estilos de visualización
                element.style.boxShadow = originalBoxShadow;
                element.style.margin = originalMargin;
                element.style.padding = originalPadding;
                
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;
                const ratio = imgWidth / imgHeight;
                
                const pdfWidth = 215.9; // Carta estándar en mm (8.5 pulgadas)
                const margin = 5; // Margen mínimo estético de 5mm
                
                const printableWidth = pdfWidth - (margin * 2);
                const printableHeight = printableWidth / ratio;
                const pdfHeight = printableHeight + (margin * 2);
                
                const { jsPDF } = window.jspdf || window;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: [pdfWidth, pdfHeight] // Alto proporcional perfecto
                });
                
                pdf.addImage(imgData, 'JPEG', margin, margin, printableWidth, printableHeight, undefined, 'FAST');
                
                const op = window.printData?.op || window.printData?.id_reporte || 'Novedad';
                pdf.save(`Reporte_Calidad_OP_${op}.pdf`);
                
            } catch (err) {
                console.error(err);
                alert('No se pudo generar el PDF: ' + err.message);
            } finally {
                // 2. Restaurar de inmediato los iframes originales e interactivos de Google Maps en la pantalla
                for (const state of savedMapStates) {
                    state.container.innerHTML = state.originalHTML;
                }
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        window.onload = () => {
            init().then(() => {
                if (window.printData && window.printData._autoPrint) {
                    setTimeout(() => window.print(), 800);
                }
            });
        };
    </script>
</body>
