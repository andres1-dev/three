<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <title>Métricas - Grupo TDM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    
    <script>
      (function(){
        const s = localStorage.getItem('busint_user');
        if(!s || s==='undefined' || s==='null') window.location.replace('login.html');
      })();
    </script>
    <style>
        body { opacity: 0; visibility: hidden; transition: opacity 0.2s; background: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif;}
        body.auth-shield-pass { opacity: 1; visibility: visible; }
        
        .wrapper-dashboard {
            width: 96%; max-width: 1400px; margin: 80px auto 2rem; padding: 2rem;
            background: transparent; position: relative; z-index: 10;
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .title-group h1 { font-size: 1.8rem; font-weight: 800; margin: 0; color: #0f172a; }
        .title-group p { color: #64748b; margin: 5px 0 0; }
        
        .filters-bar {
            display: flex; gap: 15px; margin-bottom: 25px; align-items: flex-end; flex-wrap: wrap;
            background: transparent; padding: 20px; border-radius: 16px; border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .filter-group { flex: 1; min-width: 200px; max-width: 350px; }
        .filter-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 8px; display: block; }
        .filter-input { width: 100%; border: 1px solid rgba(203, 213, 225, 0.6); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .filter-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background: rgba(255, 255, 255, 0.7); }
        
        .btn-export {
            background: rgba(59, 130, 246, 0.8); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; height: 41px; white-space: nowrap; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .btn-export.json { background: rgba(99, 102, 241, 0.8); }
        .btn-export.csv { background: rgba(20, 184, 166, 0.8); }
        .btn-export.green { background: rgba(16, 185, 129, 0.8); }
        .btn-export:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-export:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-premium-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 30px; font-size: 0.85rem; font-weight: 700; color: #475569; text-decoration: none; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-premium-back:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15); color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); }
        .btn-premium-back i { transition: transform 0.3s ease; }
        .btn-premium-back:hover i { transform: translateX(-4px); }

        .filter-actions-main { display: flex; gap: 10px; align-items: flex-end; }
        .filter-actions-export { display: flex; gap: 10px; align-items: flex-end; flex: 2; justify-content: flex-end; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: transparent; padding: 20px; border-radius: 16px; border: 1px solid rgba(226, 232, 240, 0.6); }
        .stat-label { font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        .stat-value { font-size: 1.5rem; font-weight: 800; color: #0f172a; }
        
        .charts-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; margin-bottom: 30px; }
        .card { background: transparent; border-radius: 20px; padding: 25px; border: 1px solid rgba(226, 232, 240, 0.6); }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #1e293b; }

        #loaderOverlay {
            position: fixed; top: 70px; left: 0; width: 100%; height: calc(100% - 70px); background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 999; overflow-y: auto; padding-top: 2rem;
        }

        .actions-container { display: flex; gap: 10px; align-items: flex-end; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
        .actions-menu { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .fab-toggle { display: none; }

        @media (max-width: 767px) {
            #loaderOverlay { top: 60px; height: calc(100% - 60px); padding-top: 1rem; }
            .stats-grid, .skeleton-stats-grid { grid-template-columns: 1fr 1fr !important; }
            .charts-grid, .skeleton-charts-grid { grid-template-columns: 1fr !important; }
            .wrapper-dashboard { padding: 1rem; width: 100%; margin-top: 60px; }
            .filters-bar { flex-direction: column; align-items: stretch; padding: 15px; }
            .filter-group { max-width: none; margin-bottom: 10px; }
            
            .actions-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; flex-direction: column-reverse; align-items: flex-end; }
            .actions-menu { display: none; flex-direction: column; align-items: flex-end; background: rgba(255,255,255,0.85); padding: 15px; border-radius: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid rgba(226,232,240,0.6); }
            .actions-container.open .actions-menu { display: flex; }
            .fab-toggle { display: flex; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; justify-content: center; align-items: center; font-size: 1.5rem; border: none; box-shadow: 0 4px 12px rgba(59,130,246,0.3); outline: none; cursor: pointer; transition: transform 0.2s; }
            .actions-container.open .fab-toggle { transform: rotate(45deg); }
            
            .btn-export { width: auto; min-width: 180px; justify-content: flex-start; }
            .header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div id="loaderOverlay">
        <style>
            @keyframes skeleton-loading {
                0% { background-position: 200% 0; }
                100% { background-position: -200% 0; }
            }
            .skeleton-box {
                background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
                background-size: 200% 100%;
                animation: skeleton-loading 1.5s infinite;
                border-radius: 8px;
            }
        </style>
        <div style="width: 90%; max-width: 1200px; padding: 2rem; display: flex; flex-direction: column; gap: 24px;">
            <!-- Header skeleton -->
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div class="skeleton-box" style="width: 250px; height: 32px; margin-bottom: 8px;"></div>
                    <div class="skeleton-box" style="width: 400px; height: 16px;"></div>
                </div>
                <div class="skeleton-box" style="width: 150px; height: 36px; border-radius: 20px;"></div>
            </div>

            <!-- Stats grid skeleton -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;" class="skeleton-stats-grid">
                <div style="background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; display:flex; flex-direction:column; gap:10px;">
                    <div class="skeleton-box" style="width: 60%; height: 12px;"></div>
                    <div class="skeleton-box" style="width: 40%; height: 28px;"></div>
                </div>
                <div style="background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; display:flex; flex-direction:column; gap:10px;">
                    <div class="skeleton-box" style="width: 70%; height: 12px;"></div>
                    <div class="skeleton-box" style="width: 50%; height: 28px;"></div>
                </div>
                <div style="background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; display:flex; flex-direction:column; gap:10px;">
                    <div class="skeleton-box" style="width: 50%; height: 12px;"></div>
                    <div class="skeleton-box" style="width: 30%; height: 28px;"></div>
                </div>
                <div style="background: white; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; display:flex; flex-direction:column; gap:10px;">
                    <div class="skeleton-box" style="width: 80%; height: 12px;"></div>
                    <div class="skeleton-box" style="width: 45%; height: 28px;"></div>
                </div>
            </div>

            <!-- Charts skeleton -->
            <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px;" class="skeleton-charts-grid">
                <div style="background: white; border: 1px solid #e2e8f0; padding: 25px; border-radius: 20px; height: 350px; display:flex; flex-direction:column; gap:15px;">
                    <div class="skeleton-box" style="width: 40%; height: 16px; margin-bottom:10px;"></div>
                    <div class="skeleton-box" style="width: 100%; flex:1; border-radius:12px;"></div>
                </div>
                <div style="background: white; border: 1px solid #e2e8f0; padding: 25px; border-radius: 20px; height: 350px; display:flex; flex-direction:column; gap:15px;">
                    <div class="skeleton-box" style="width: 30%; height: 16px; margin-bottom:10px;"></div>
                    <div class="skeleton-box" style="width: 100%; flex:1; border-radius:12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="wrapper-dashboard" style="display: none;" id="mainDashboard">
        <div class="header" style="justify-content: flex-end;">
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div id="dateRangeDisplay" style="font-weight: 600; color: #64748b; font-size: 0.9rem; margin-bottom: 12px;"></div>
                <a href="resolucion.html" class="btn-premium-back"><i class="fas fa-arrow-left"></i> Volver a Resolución</a>
            </div>
        </div>

        <div class="filters-bar">
            <div class="filter-group">
                <label class="filter-label">Rango de Fechas</label>
                <div style="position: relative;">
                    <i class="fas fa-calendar-alt" style="position: absolute; left: 12px; top: 12px; color: #475569; z-index: 10; pointer-events: none;"></i>
                    <input type="text" id="dateRangePicker" class="filter-input" placeholder="Seleccione un rango..." style="padding-left: 35px; width: 100%;">
                </div>
            </div>
            <div class="actions-container">
                <button type="button" class="fab-toggle" onclick="this.parentElement.classList.toggle('open')">
                    <i class="fas fa-bolt"></i>
                </button>
                <div class="actions-menu">
                    <button onclick="window.applyFilters()" class="btn-export green" title="Filtrar por Fechas"><i class="fas fa-filter"></i> Filtrar</button>
                    <button onclick="window.viewAllData()" class="btn-export" title="Ver Todo el Histórico"><i class="fas fa-globe"></i> Ver Todo</button>
                    <button onclick="window.descargarData('csv')" class="btn-export csv" id="btnDescCSV" title="Descargar CSV Detallado"><i class="fas fa-file-csv"></i> Descargar CSV</button>
                    <button onclick="window.descargarData('json')" class="btn-export json" id="btnDescJSON" title="Descargar Full JSON"><i class="fas fa-file-code"></i> Descargar JSON</button>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Novedades</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unidades Afectadas</div>
                <div class="stat-value" id="statUnits">0</div>
                <div style="font-size: 0.75rem; color: #64748b; margin-top: 5px; font-weight: 500;" id="statUnitsTotalLot">De 0 en lote</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Áreas con Impacto</div>
                <div class="stat-value" id="statAreas">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Lotes Afectados</div>
                <div class="stat-value" id="statLots">0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie" style="color: #f59e0b;"></i> Peso Volumétrico por Área</div>
                <div style="height: 300px;"><canvas id="chartArea"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-bar" style="color: #3b82f6;"></i> Tendencia Semanal (Cantidades)</div>
                <div style="height: 300px;"><canvas id="chartTrend"></canvas></div>
            </div>
        </div>

        <div class="charts-grid" style="grid-template-columns: 1fr; margin-top: 25px;">
            <div class="card">
                <div class="card-title"><i class="fas fa-layer-group" style="color: #8b5cf6;"></i> Detalle Consolidado de Items</div>
                <div id="chartItemsContainer" style="height: 350px;"><canvas id="chartItems"></canvas></div>
            </div>
        </div>
    </div>

    <!-- Scripts Core -->
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin/metricas.js"></script>
</body>
</html>
