<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidaciones - Grupo TDM</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <style>
        .wrapper-dashboard {
            margin-top: 80px;
            padding: 1rem 2rem;
        }

        .admin-header {
            padding: 1.5rem 2rem;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 1.5rem;
            border-radius: 12px;
        }
        
        .filter-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .filter-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-label);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            min-width: 150px;
        }
        
        .btn-search {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.3);
        }
        
        .liquidaciones-list {
            display: grid;
            gap: 1rem;
            padding: 0 2rem 2rem;
        }
        
        .liquidacion-card {
            background: var(--glass-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }
        
        .liquidacion-card:hover {
            border-color: var(--color-primary);
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text-main);
        }
        
        .card-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--color-text-label);
        }
        
        .card-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card-meta-item i {
            color: var(--color-primary);
        }
        
        .card-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-view {
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-view:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
        
        .no-data {
            text-align: center;
            color: var(--color-text-label);
            padding: 3rem;
            font-size: 1rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-label);
        }
        
        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <app-top-nav></app-top-nav>

    <div class="wrapper-dashboard">
        <div class="admin-header">
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Auditora</label>
                    <select id="auditoraFilter" class="filter-select">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Mes</label>
                    <select id="mesFilter" class="filter-select">
                        <option value="0">Enero</option>
                        <option value="1">Febrero</option>
                        <option value="2">Marzo</option>
                        <option value="3">Abril</option>
                        <option value="4">Mayo</option>
                        <option value="5">Junio</option>
                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>
                        <option value="8">Septiembre</option>
                        <option value="9">Octubre</option>
                        <option value="10">Noviembre</option>
                        <option value="11">Diciembre</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Año</label>
                    <select id="anioFilter" class="filter-select">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <button class="btn-search" onclick="buscarLiquidaciones()">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </div>
        </div>
        
        <div id="liquidacionesList" class="liquidaciones-list">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Cargando liquidaciones...</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin/liquidaciones.js"></script>
</body>
</html>
