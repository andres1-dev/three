<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Programación — Captura de Taller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="layout">
        <!-- Top nav eliminado: el header de la vista ya contiene el título y las acciones -->

        <!-- =========================================================
             MODAL 4: CALENDARIO DE ASENTAMIENTO (COMPACTO)
             ========================================================= -->
        <div id="asentarProgModal" class="modal-backdrop hidden">
            <div class="calendar-modal-box" role="dialog" aria-modal="true">
                <!-- Barra superior de navegación de mes -->
                <div class="cal-nav-bar">
                    <button type="button" id="btnCalPrevMonth" class="btn-icon cal-arrow-btn" title="Mes anterior">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <span id="calCurrentMonthLabel" class="cal-month-title">Agosto 2026</span>
                    <button type="button" id="btnCalNextMonth" class="btn-icon cal-arrow-btn" title="Mes siguiente">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                    <button id="btnCloseAsentarProgModal" class="btn-icon cal-close-btn" title="Cerrar [Esc]">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <!-- Días de la semana -->
                <div class="cal-weekdays">
                    <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                </div>

                <!-- Grilla de días -->
                <div id="calDaysGrid" class="cal-days-grid"></div>

                <!-- Input oculto para valor seleccionado -->
                <input type="hidden" id="inputAsentarProgDate" value="">

                <!-- Botón directo de Asentar -->
                <div class="cal-footer">
                    <button id="btnSubmitAsentarProgModal" class="btn-modal-primary cal-asentar-btn">
                        <span>Asentar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- =========================================================
             VIEW 4: CAPTURA DE PROGRAMACIÓN DE TALLER
             ========================================================= -->
        <div id="viewProgramacion" class="view-panel">

            <!-- Barra de acciones -->
            <div class="prog-header-actions">
                    <button id="btnProgToggleSheet" class="btn-ghost" title="Ver / ocultar el plano de datos pegado">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="3" y1="15" x2="21" y2="15"></line>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                            <line x1="15" y1="3" x2="15" y2="21"></line>
                        </svg>
                        <span>Ver Plano</span>
                    </button>
                    <input type="file" id="progFileInput" accept=".xlsx,.xls,.csv" style="display:none">
                    <button id="btnProgClear" class="btn-ghost" title="Limpiar datos pegados">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        <span>Limpiar</span>
                    </button>
                    <button id="btnProgCopyJSON" class="btn-ghost" disabled title="Copiar datos en formato JSON">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                        </svg>
                        <span>Copiar JSON</span>
                    </button>
                    <button id="btnProgToggleJson" class="btn-ghost" title="Ver / ocultar el JSON generado">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                        <span>Ver JSON</span>
                    </button>
                    <button id="btnProgSave" class="btn-ghost btn-prog-save" disabled title="Exportar datos a CSV">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12"></path>
                            <polyline points="8 11 12 15 16 11"></polyline>
                            <path d="M4 17v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2"></path>
                        </svg>
                        <span>Exportar CSV</span>
                    </button>
                    <button id="btnProgAsentar" class="btn-ghost btn-prog-asentar" disabled title="Guardar registros en la hoja DESPACHOS_N">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                        <span>Asentar</span>
                    </button>
                </div>

            <!-- Zona Excel — recibe el paste y renderiza la tabla -->
            <div id="progExcelZone" class="prog-excel-zone" tabindex="0" role="grid"
                aria-label="Área de pegado de tabla. Haz clic y pega con Ctrl+V">
            </div>

            <!-- Lotes: vista tipo MAP DE COLECCIÓN (matriz color × talla) -->
            <div class="lotes-top-bar hidden">
                <div class="lotes-filter">
                    <input type="text" id="progFilterOp" placeholder="Filtrar por OP…" inputmode="numeric">
                    <button id="btnProgClearFilter" class="btn-ghost" title="Limpiar filtro">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="lotes-stats">
                    <span class="lotes-stat" id="lotesSource">Sin datos</span>
                    <span class="lotes-stat"><strong id="lotesStatOps">0</strong>&nbsp;OPs</span>
                    <span class="lotes-stat"><strong id="lotesStatExt">0</strong>&nbsp;extensiones</span>
                </div>
            </div>
            <div id="lotesContainer" class="lotes-container hidden">
                <div class="lotes-empty">Pega la tabla o sube el Excel de colección para ver los lotes</div>
            </div>

            <!-- JSON generado -->
            <div id="jsonSection" class="json-section hidden">
                <div class="json-section-bar">
                    <span class="json-section-title">JSON de programación</span>
                    <button id="btnProgCopyJsonView" class="btn-ghost" title="Copiar JSON al portapapeles">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                        <span>Copiar</span>
                    </button>
                </div>
                <div class="json-container">
                    <pre id="jsonContent">[]</pre>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
