<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Calidad — Plantilla Básica (Estilo Liquidación)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --color-primary: #3f51b5;
      --color-primary-dark: #303f9f;
      --color-border: #e2e8f0;
      --color-text-main: #1e293b;
      --color-text-label: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.95);
      --bg-table-header: #f8fafc;
      --bg-total-row: #f1f5f9;
      --bg-visita-cell: #dbeafe;
      --color-visita-cell: #1e40af;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 9pt;
      color: var(--color-text-main);
      background: #f1f5f9;
      line-height: 1.4;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Hoja A4 ── */
    .sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      margin: 18px auto;
      padding: 12mm 14mm 10mm;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(63, 81, 181, 0.08);
    }

    /* ── Bloque de Cabecera (Idéntico a liquidacion-rodamiento) ── */
    .header-block {
      margin-bottom: 0.8rem;
      padding: 0.75rem 1rem;
      background: var(--glass-bg);
      border: 2px solid var(--color-primary);
      border-radius: 8px;
    }

    .header-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-title-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .header-logo-svg {
      width: 40px;
      height: 40px;
      display: block;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .header-title h2 {
      font-size: 11.5pt;
      font-weight: 800;
      color: var(--color-primary);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.2;
    }

    .header-title p {
      margin: 0;
      line-height: 1.25;
    }

    .header-prod-name {
      font-size: 8pt;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 2px;
    }

    .header-prod-nit {
      font-size: 7pt;
      font-weight: 600;
      color: var(--color-text-label);
      letter-spacing: 0.3px;
      margin-top: 1px;
    }

    .header-data {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      align-items: center;
    }

    .header-data p {
      margin: 0;
      font-size: 8.5pt;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.25;
    }

    .header-data p strong {
      display: block;
      font-size: 6.5pt;
      color: var(--color-text-label);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1px;
    }

    /* ── Barra de Estado y Decisión ── */
    .status-band {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      margin-bottom: 0.75rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      font-size: 8pt;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11.5pt;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: transparent !important;
      line-height: 1.2;
      margin-top: -3.5px;
      box-sizing: border-box;
    }

    .status-badge.aprobado {
      background: transparent !important;
      color: #16a34a;
      border: 1.5px solid #16a34a;
    }

    .status-badge.rechazado {
      background: transparent !important;
      color: #dc2626;
      border: 1.5px solid #dc2626;
    }

    .status-badge.pausado,
    .status-badge.pending {
      background: transparent !important;
      color: #2563eb;
      border: 1.5px solid #2563eb;
    }

    /* ── Secciones con Recuadros (summary / cards) ── */
    .section-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .section-header {
      background: var(--bg-table-header);
      border-bottom: 1px solid var(--color-border);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-header h4 {
      font-size: 8pt;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-header span.badge-info {
      font-size: 7.5pt;
      font-weight: 600;
      color: var(--color-text-label);
      background: #ffffff;
      padding: 2px 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
    }

    /* ── Cuadrícula de Datos de Operación y Taller ── */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .data-cell {
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: 5px 10px;
    }

    .data-cell:nth-child(4n) {
      border-right: none;
    }

    .data-cell.span2 {
      grid-column: span 2;
    }

    .data-cell .lbl {
      display: block;
      font-size: 6.5pt;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-text-label);
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .data-cell .val {
      font-size: 8.5pt;
      font-weight: 700;
      color: var(--color-text-main);
      word-break: break-word;
    }

    .data-cell .val.highlight {
      color: var(--color-primary);
    }

    /* ── Tabla Estilo liquidacion-table (Exacto Legacy) ── */
    .liquidacion-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      font-size: 8pt;
    }

    .liquidacion-table th,
    .liquidacion-table td {
      border: 1px solid var(--color-border);
      padding: 4.5px 7px;
      text-align: center;
      vertical-align: middle;
    }

    .liquidacion-table th {
      background: var(--bg-table-header);
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      font-size: 7pt;
      letter-spacing: 0.5px;
    }

    .liquidacion-table td {
      color: var(--color-text-main);
    }

    .liquidacion-table td.td-highlight {
      background: #f8fafc;
    }

    .liquidacion-table tr:hover td,
    .liquidacion-table tr:hover td.td-highlight {
      background: #f1f5f9;
    }

    .liquidacion-table .planta-name {
      text-align: left;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .liquidacion-table .total-row {
      background: var(--bg-total-row);
      font-weight: 700;
      color: var(--color-primary);
      border-top: 1.5px solid var(--color-border);
    }

    .liquidacion-table .visita-cell {
      font-weight: 700;
      color: var(--color-text-main);
    }

    .empty-msg {
      padding: 12px;
      text-align: center;
      color: var(--color-text-label);
      font-size: 8pt;
      font-style: italic;
    }

    /* ── Observaciones (Estilo Summary Card) ── */
    .obs-box {
      padding: 8px 12px;
      font-size: 8.5pt;
      color: var(--color-text-main);
      min-height: 44px;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-word;
      text-indent: 0;
    }

    /* ── Firmas (Estilo Liquidación) ── */
    .firmas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .firma-cell {
      padding: 8px 14px;
      text-align: center;
      border-right: 1px solid var(--color-border);
    }

    .firma-cell:last-child {
      border-right: none;
    }

    .firma-img-box {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      overflow: hidden;
    }

    .firma-img-box img,
    .firma-img-box svg {
      max-height: 46px;
      max-width: 160px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: inline-block;
    }

    .firma-line {
      border-top: 1px solid #cbd5e1;
      width: 75%;
      margin: 0 auto 3px;
    }

    .firma-role {
      font-size: 6.5pt;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-text-label);
      letter-spacing: 0.4px;
    }

    .firma-name {
      font-size: 8.5pt;
      font-weight: 700;
      color: var(--color-text-main);
      margin-top: 1px;
    }

    .firma-cc {
      font-size: 7pt;
      color: var(--color-text-label);
    }

    /* ── Pie de Página ── */
    .doc-footer {
      margin-top: 8px;
      border-top: 1px solid var(--color-border);
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 6.5pt;
      color: var(--color-text-label);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── Panel Flotante de Control ── */
    .control-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 99999;
    }

    .btn-ctrl {
      padding: 10px 18px;
      border: none;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(63, 81, 181, 0.35);
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-ctrl:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(63, 81, 181, 0.45);
    }

    .btn-premium {
      background: var(--color-primary);
      color: #ffffff;
    }

    .btn-print {
      background: #1e293b;
      color: #ffffff;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .sheet {
        margin: 0;
        box-shadow: none;
        border: none;
        padding: 5mm 8mm;
        width: 100%;
        min-height: auto;
      }
      .control-panel {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="sheet" id="app">
    <div style="text-align:center;padding:60px 20px;color:var(--color-text-label);">
      <i class="fas fa-spinner fa-spin" style="font-size:24px;color:var(--color-primary);margin-bottom:12px;"></i>
      <p style="font-weight:600;">Cargando reporte de calidad...</p>
    </div>
  </div>

  <div class="control-panel">
    <a class="btn-ctrl btn-premium" href="./calidad.html">
      <i class="fas fa-star"></i> Plantilla Completa
    </a>
    <button class="btn-ctrl btn-print" onclick="window.print()">
      <i class="fas fa-print"></i> Imprimir / PDF
    </button>
  </div>

  <script type="module">
    import { LocalStorageCalidadRepository } from './infrastructure/repositories/LocalStorageCalidadRepository.js';

    const app = document.getElementById('app');

    function fmt(val, fallback = '—') {
      if (val === null || val === undefined || val === '' || val === 'N/A' || val === 'null') {
        return fallback;
      }
      return String(val).trim();
    }

    function renderFirmaHtml(firma, fallbackText = 'Firma Digital') {
      if (!firma) {
        return `<span style="color:#94a3b8;font-size:7.5pt;font-style:italic;">${fallbackText}</span>`;
      }
      let f = String(firma).trim();
      if (!f || f === 'null' || f === 'undefined') {
        return `<span style="color:#94a3b8;font-size:7.5pt;font-style:italic;">${fallbackText}</span>`;
      }

      // Si viene como SVG (código XML o elemento <svg>)
      if (f.startsWith('<svg') || f.includes('<svg')) {
        const match = f.match(/<svg[\s\S]*<\/svg>/i);
        let svg = match ? match[0] : f;

        // Asegurar viewBox si no tiene para permitir escalado responsivo
        if (!svg.includes('viewBox') && !svg.includes('viewbox')) {
          const wMatch = svg.match(/width=["'](\d+(?:\.\d+)?)["']/i);
          const hMatch = svg.match(/height=["'](\d+(?:\.\d+)?)["']/i);
          if (wMatch && hMatch) {
            svg = svg.replace(/<svg/i, `<svg viewBox="0 0 ${wMatch[1]} ${hMatch[1]}"`);
          }
        }
        return svg.replace(/<svg/i, '<svg style="max-height:46px;max-width:160px;width:auto;height:auto;display:inline-block;"');
      }

      // Si viene como URL o data URI
      if (f.startsWith('data:') || f.startsWith('http://') || f.startsWith('https://') || f.startsWith('/') || f.startsWith('./')) {
        return `<img src="${f}" alt="Firma" style="max-height:46px;max-width:160px;object-fit:contain;display:inline-block;">`;
      }

      return `<span style="color:#94a3b8;font-size:7.5pt;font-style:italic;">${fallbackText}</span>`;
    }

    function limpiarProductora(val) {
      if (!val || val === 'N/A' || val === 'null') return '—';
      const str = String(val).trim();
      if (/^\d+$/.test(str)) {
        try {
          const cache = JSON.parse(localStorage.getItem('busint_productoras_cache') || '[]');
          const found = cache.find(x => String(x.id_productora) === str);
          if (found && found.productora) return found.productora.trim();
        } catch (_) {}
      }
      const stripped = str.replace(/^\s*\d+\s*[-—–]+\s*/, '').trim();
      return stripped || str;
    }

    function getEstadoBadge(conclusion) {
      const c = (conclusion || '').toUpperCase().trim();
      if (c === 'APROBADO') {
        return { cls: 'aprobado', text: 'APROBADO' };
      }
      if (c === 'RECHAZADO') {
        return { cls: 'rechazado', text: 'RECHAZADO' };
      }
      if (c === 'PAUSADO') {
        return { cls: 'pausado', text: 'PAUSADO' };
      }
      return { cls: 'pending', text: c || 'PENDIENTE' };
    }

    function getTituloVisita(tipo) {
      const t = (tipo || '').toUpperCase();
      if (t.includes('RONDA')) return 'RONDA DE CALIDAD';
      if (t.includes('CONTRAMUESTRA')) return 'CONTRAMUESTRA DE CALIDAD';
      if (t.includes('SEGUIMIENTO')) return 'SEGUIMIENTO DE CALIDAD';
      if (t.includes('APROBACION') || t.includes('APROBACIÓN')) return 'APROBACIÓN DE PLANTA';
      return 'AUDITORÍA DE CALIDAD';
    }

    function calcularDVNit(nit) {
      nit = String(nit).replace(/[.\-\s]/g, "");

      if (!/^\d+$/.test(nit)) {
        throw new Error("El NIT debe contener solo dígitos");
      }

      const pesos = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 61, 67];
      const digitos = nit.split("").reverse().map(Number);

      let suma = 0;
      for (let i = 0; i < digitos.length; i++) {
        suma += digitos[i] * pesos[i];
      }

      const residuo = suma % 11;
      return String(residuo < 2 ? residuo : 11 - residuo);
    }

    function formatearNIT(nit) {
      if (!nit) return '';
      try {
        let base = String(nit).trim();
        if (base.includes('-')) {
          base = base.split('-')[0];
        }
        const nitLimpio = base.replace(/[.\-\s]/g, "");
        if (!nitLimpio || !/^\d+$/.test(nitLimpio)) return String(nit);
        const dv = calcularDVNit(nitLimpio);
        const conPuntos = nitLimpio.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return `${conPuntos}-${dv}`;
      } catch (_) {
        return String(nit);
      }
    }

    function obtenerNitProductora(r, raw) {
      let rawNit = r?.nitProductora || r?.nit || raw?.nit_productora || raw?.nit || raw?.productora_nit;
      if (rawNit && String(rawNit).trim() && String(rawNit).trim() !== '—' && String(rawNit).trim() !== 'null') {
        return formatearNIT(String(rawNit).trim());
      }

      let idProd = raw?.id_productora || r?.idProductora;
      if (!idProd && (r?.productora || raw?.productora)) {
        const m = String(r?.productora || raw?.productora).match(/^\s*(\d+)\s*[-—–]/);
        if (m) idProd = m[1];
      }

      try {
        const cache = JSON.parse(localStorage.getItem('busint_productoras_cache') || '[]');
        if (Array.isArray(cache) && cache.length) {
          const found = cache.find(p => 
            (idProd && String(p.id_productora ?? p.id) === String(idProd)) ||
            (p.productora && String(p.productora).toUpperCase() === String(limpiarProductora(r?.productora || raw?.productora)).toUpperCase()) ||
            (p.nombre_corto && String(p.nombre_corto).toUpperCase() === String(limpiarProductora(r?.productora || raw?.productora)).toUpperCase())
          );
          if (found && (found.nit || found.NIT)) {
            return formatearNIT(String(found.nit || found.NIT).trim());
          }
        }
      } catch (_) {}

      const CATALOGO_PRODUCTORAS = {
        '1': '900284712',
        '2': '900415829',
        '3': '900327654',
        '4': '830089444',
        'TEXTILES Y CREACIONES EL UNIVERSO S.A.S.': '900284712',
        'TEXTILES Y CREACIONES LOS ANGELES S.A.S.': '900415829',
        'HACEMOS MODA S.A.S.': '900327654',
        'INVERSIONES URBANA S.A.S.': '900512348',
        'EL TEMPLO DE LA MODA S.A.S.': '830089444',
        'GRUPO TDM': '830089444'
      };

      if (idProd && CATALOGO_PRODUCTORAS[String(idProd)]) {
        return formatearNIT(CATALOGO_PRODUCTORAS[String(idProd)]);
      }

      const clean = limpiarProductora(r?.productora || raw?.productora);
      if (clean && CATALOGO_PRODUCTORAS[clean.toUpperCase()]) {
        return formatearNIT(CATALOGO_PRODUCTORAS[clean.toUpperCase()]);
      }

      return null;
    }

    function renderCurva(curva, raw) {
      let c = curva;

      // 1. Si el entity no tiene filas/tallas, armar desde raw
      if (!c || !c.tallas || !c.tallas.length || !c.filas || !c.filas.length) {
        const rawCurva = raw?.curva_extensiones || raw?.curvaExtensiones || raw?.curva || raw?.extensiones || raw?.curva_produccion;
        if (rawCurva) {
          try {
            const items = typeof rawCurva === 'string' ? JSON.parse(rawCurva) : rawCurva;
            if (items && Array.isArray(items.tallas) && Array.isArray(items.filas) && items.filas.length > 0) {
              c = items;
            } else if (Array.isArray(items) && items.length > 0) {
              const tallasSet = new Set();
              items.forEach(i => { const t = String(i.talla ?? i.TALLA ?? '').trim(); if (t) tallasSet.add(t); });
              const tallas = Array.from(tallasSet);
              const colorMap = new Map();
              items.forEach(i => {
                const color = i.color || i.COLOR || 'ÚNICO';
                const talla = String(i.talla ?? i.TALLA ?? '').trim();
                const cant  = Number(i.cantidad ?? i.CANTIDAD ?? 0);
                if (!colorMap.has(color)) colorMap.set(color, { color, cantidades: {} });
                colorMap.get(color).cantidades[talla] = (colorMap.get(color).cantidades[talla] || 0) + cant;
              });
              c = { tallas, filas: Array.from(colorMap.values()) };
            }
          } catch (_) {}
        }
      }

      if (!c || !c.tallas || !c.tallas.length || !c.filas || !c.filas.length) {
        return `
          <div class="section-card">
            <div class="section-header">
              <h4><i class="fas fa-layer-group"></i> Curva de Producción</h4>
            </div>
            <div class="empty-msg">Sin registro de curva / extensiones de confección para esta OP.</div>
          </div>
        `;
      }

      // 2. Calcular descuentos desde novedades_auditoria (SIN CONFECCIONAR)
      const descuentos = {}; // 'COLOR||TALLA' -> qty
      // Anotaciones informativas (COBRO, PROMOCION, LAVADO) — no descuentan, solo se marcan
      const anotaciones = {}; // 'COLOR||TALLA' -> { tipo, qty }[]
      let novRaw = raw?.novedades_auditoria || raw?.novedades;
      if (typeof novRaw === 'string') { try { novRaw = JSON.parse(novRaw); } catch (_) { novRaw = null; } }
      if (Array.isArray(novRaw)) {
        for (const nov of novRaw) {
          const tipoUp = (nov.tipo || '').toUpperCase();
          const esSinConfeccionar = tipoUp === 'SIN CONFECCIONAR';
          const esAnotacion = tipoUp.includes('COBR') || tipoUp.includes('PROMOCI') || tipoUp.includes('LAVADO') || esSinConfeccionar;
          for (const cod of (nov.codigos || [])) {
            const k = `${(cod.color || '').toUpperCase()}||${cod.talla}`;
            if (esSinConfeccionar) {
              descuentos[k] = (descuentos[k] || 0) + Number(cod.cantidad || 0);
            }
            if (esAnotacion) {
              if (!anotaciones[k]) anotaciones[k] = [];
              anotaciones[k].push({ tipo: nov.tipo, qty: Number(cod.cantidad || 0) });
            }
          }
        }
      }
      const totalDescontado = Object.values(descuentos).reduce((s, v) => s + v, 0);
      const hayDescuentos = totalDescontado > 0;

      const tallas = c.tallas;
      const thTallas = tallas.map(t => `<th>${t}</th>`).join('');

      let granTotalReal   = 0;
      let granTotalActual = 0;

      const rows = c.filas.map(f => {
        const colorKey = (f.color || f.COLOR || '').toUpperCase();
        let totalReal = 0, totalActual = 0;
        const celdas = tallas.map(t => {
          const qR = Number(f.cantidades?.[t] ?? f.cantidadesPorTalla?.[t] ?? f.cantidades?.[String(t)] ?? f[t] ?? 0);
          const desc = descuentos[`${colorKey}||${t}`] || 0;
          const qA = Math.max(0, qR - desc);
          totalReal   += qR;
          totalActual += qA;
          // Anotaciones (SIN CONFECCIONAR descuenta, cobro/promo/lavado solo marcan)
          const anots = anotaciones[`${colorKey}||${t}`];
          if (anots && anots.length > 0) {
            const iconMap = {
              'SIN CONF': '<i class="fas fa-scissors" style="font-size:6pt;color:#cbd5e1;"></i>',
              COBR:       '<i class="fas fa-money-bill" style="font-size:6pt;color:#cbd5e1;"></i>',
              PROMOCI:    '<i class="fas fa-tag" style="font-size:6pt;color:#cbd5e1;"></i>',
              LAVADO:     '<i class="fas fa-droplet" style="font-size:6pt;color:#cbd5e1;"></i>'
            };
            const anotHtml = anots.map(a => {
              const tipoUp = (a.tipo || '').toUpperCase();
              const icono = Object.entries(iconMap).find(([k]) => tipoUp.includes(k))?.[1] || '<i class="fas fa-circle-dot" style="font-size:6pt;color:#cbd5e1;"></i>';
              return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:6.5pt;">${icono}<span style="color:#cbd5e1;font-weight:600;">${a.qty}</span></span>`;
            }).join('');
            return `<td style="background:#f8fafc;padding:2px 4px;">
              <span style="display:flex;align-items:center;gap:3px;justify-content:center;flex-wrap:wrap;">${anotHtml}</span>
              <span style="display:block;font-weight:700;color:#334155;font-size:8.5pt;line-height:1.3;text-align:center;">${desc > 0 ? `${qA > 0 ? qA : '—'} <span style="text-decoration:line-through;color:#cbd5e1;font-size:7pt;font-weight:400;">${qR}</span>` : (qA > 0 ? qA : '—')}</span>
            </td>`;
          }
          return `<td class="${qA > 0 ? 'visita-cell' : ''}">${qA > 0 ? qA : '—'}</td>`;
        }).join('');
        granTotalReal   += totalReal;
        granTotalActual += totalActual;
        return `<tr>
          <td class="planta-name">${fmt(f.color || f.COLOR)}</td>
          ${celdas}
          <td style="font-weight:700;color:var(--color-primary);">${totalActual}</td>
        </tr>`;
      }).join('');

      const totalesPorTalla = tallas.map(t => {
        const tot = c.filas.reduce((acc, f) => {
          const colorKey = (f.color || f.COLOR || '').toUpperCase();
          const qR = Number(f.cantidades?.[t] ?? f.cantidadesPorTalla?.[t] ?? f.cantidades?.[String(t)] ?? f[t] ?? 0);
          const desc = descuentos[`${colorKey}||${t}`] || 0;
          return acc + Math.max(0, qR - desc);
        }, 0);
        return `<td>${tot}</td>`;
      }).join('');

      // Consolidar totales de anotaciones para el badge
      const totalCobros    = Object.values(anotaciones).flat().filter(a => (a.tipo||'').toUpperCase().includes('COBR')).reduce((s,a) => s + a.qty, 0);
      const totalPromos    = Object.values(anotaciones).flat().filter(a => (a.tipo||'').toUpperCase().includes('PROMOCI')).reduce((s,a) => s + a.qty, 0);
      const totalLavados   = Object.values(anotaciones).flat().filter(a => (a.tipo||'').toUpperCase().includes('LAVADO')).reduce((s,a) => s + a.qty, 0);

      const badgeParts = [];
      if (totalDescontado > 0) badgeParts.push(`<span style="display:inline-flex;align-items:center;gap:3px;"><i class="fas fa-scissors" style="color:#64748b;font-size:7pt;"></i><span style="color:#64748b;font-size:7pt;font-weight:600;">S/C: ${totalDescontado}</span></span>`);
      if (totalCobros    > 0) badgeParts.push(`<span style="display:inline-flex;align-items:center;gap:3px;"><i class="fas fa-money-bill" style="color:#64748b;font-size:7pt;"></i><span style="color:#64748b;font-size:7pt;font-weight:600;">Cobro: ${totalCobros}</span></span>`);
      if (totalPromos    > 0) badgeParts.push(`<span style="display:inline-flex;align-items:center;gap:3px;"><i class="fas fa-tag" style="color:#64748b;font-size:7pt;"></i><span style="color:#64748b;font-size:7pt;font-weight:600;">Promo: ${totalPromos}</span></span>`);
      if (totalLavados   > 0) badgeParts.push(`<span style="display:inline-flex;align-items:center;gap:3px;"><i class="fas fa-droplet" style="color:#64748b;font-size:7pt;"></i><span style="color:#64748b;font-size:7pt;font-weight:600;">Lavado: ${totalLavados}</span></span>`);

      const badgeHtml = badgeParts.length > 0
        ? `<span class="badge-info" style="display:inline-flex;align-items:center;gap:8px;">${badgeParts.join('<span style="color:#e2e8f0;">|</span>')}</span>`
        : ``;

      const notaDescuento = '';

      return `
        <div class="section-card">
          <div class="section-header">
            <h4><i class="fas fa-layer-group"></i> Curva de Producción</h4>
            ${badgeHtml}
          </div>
          <table class="liquidacion-table">
            <thead>
              <tr>
                <th style="text-align:left;min-width:110px;">Color</th>
                ${thTallas}
                <th style="min-width:60px;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
              <tr class="total-row">
                <td class="planta-name">TOTAL</td>
                ${totalesPorTalla}
                <td>${granTotalActual}</td>
              </tr>
            </tbody>
          </table>
          ${notaDescuento}
        </div>
      `;
    }

    function renderHallazgos(reporte, raw) {
      let items = [];

      // 1. PRIORIDAD: novedades_auditoria crudas — tienen codigos[] con color/talla/cantidad
      let novRaw = raw?.novedades_auditoria || raw?.novedades;
      if (typeof novRaw === 'string') {
        try { novRaw = JSON.parse(novRaw); } catch (_) { novRaw = null; }
      }
      if (Array.isArray(novRaw) && novRaw.length > 0) {
        items = novRaw.map((n, i) => ({
          idx: i + 1,
          tipo: n.tipo || 'HALLAZGO',
          proceso: n.proceso || null,
          sin_proceso: !!n.sin_proceso,
          codigos: Array.isArray(n.codigos) ? n.codigos : [],
          color: n.color || '—',
          total: Number(n.totalUnidades || n.defectuosas || n.cantidad || 1)
        }));
      }

      // 2. Fallback: entities HallazgoDefectoEntity (cantidadesPorTalla → codigos[])
      if (!items.length && Array.isArray(reporte.hallazgos) && reporte.hallazgos.length > 0) {
        items = reporte.hallazgos.map((h, i) => {
          const codigos = [];
          if (h.cantidadesPorTalla && Object.keys(h.cantidadesPorTalla).length > 0) {
            for (const [talla, cantidad] of Object.entries(h.cantidadesPorTalla)) {
              if (Number(cantidad) > 0) codigos.push({ color: h.color || '—', talla, cantidad: Number(cantidad) });
            }
          }
          const total = typeof h.getTotalUnidades === 'function' ? h.getTotalUnidades() : (h.totalUnidades || h.cantidad || 1);
          return {
            idx: i + 1,
            tipo: h.tipo || 'NO ESPECIFICADO',
            proceso: h.causa || null,
            sin_proceso: false,
            codigos: codigos.length ? codigos : [{ color: h.color || '—', talla: '—', cantidad: total }],
            color: h.color || '—',
            total
          };
        });
      }

      if (!items.length) {
        return `
          <div class="section-card">
            <div class="section-header">
              <h4><i class="fas fa-clipboard-check"></i> Hallazgos y Defectos de Calidad</h4>
            </div>
            <div class="empty-msg">No se registraron defectos ni novedades en este lote. Auditoría conforme.</div>
          </div>
        `;
      }

      const totalDefectos = items.reduce((acc, it) => acc + (Number(it.total) || 0), 0);
      const totalPrendas = Number(reporte.cantidadTotal || raw?.cantidad || 0);
      const tasaGlobal = totalPrendas > 0 ? ((totalDefectos / totalPrendas) * 100).toFixed(2) + '%' : '—';

      // ── Agrupar consecutivos por TIPO ──
      const grupos = [];
      for (const it of items) {
        const last = grupos[grupos.length - 1];
        if (last && last.tipo === it.tipo) {
          last.entries.push(it);
          last.total += Number(it.total) || 0;
        } else {
          grupos.push({ tipo: it.tipo, idx: it.idx, entries: [it], total: Number(it.total) || 0 });
        }
      }

      const rowsHtml = grupos.map(g => {
        // Expandir cada entry en sub-filas por codigos[]
        const subFilas = [];
        for (const entry of g.entries) {
          const proceso = entry.sin_proceso ? 'SIN PROCESO' : (entry.proceso || '');
          const codigos = entry.codigos && entry.codigos.length ? entry.codigos : [{ color: entry.color, talla: '—', cantidad: entry.total }];

          const tipoUpper = String(entry.tipo || g.tipo || '').toUpperCase().trim();
          const isPromocion = tipoUpper.includes('PROMOCI');
          const isCobro = tipoUpper.includes('COBR');

          codigos.forEach((c, ci) => {
            const procesoCell = ci === 0 ? proceso : '';
            const procCellUpper = String(procesoCell).toUpperCase().trim();
            const cellHasData = procCellUpper !== '' && procCellUpper !== '—';

            // Solo se marca la fila que tiene algún proceso con dato; si está vacío no debe marcarse
            let isRowHighlighted = false;
            if (cellHasData) {
              if (isPromocion && procCellUpper === 'SIN PROCESO') {
                isRowHighlighted = true;
              } else if (isCobro && procCellUpper !== 'SIN PROCESO') {
                isRowHighlighted = true;
              }
            }

            subFilas.push({
              isFirstOfGroup: subFilas.length === 0,
              proceso: procesoCell,
              color: c.color || '—',
              talla: c.talla || '—',
              cantidad: Number(c.cantidad) || 0,
              isHighlighted: isRowHighlighted
            });
          });
        }

        const rowCount = subFilas.length;

        return subFilas.map((sf, si) => {
          const isFirst = si === 0;
          const isLast  = si === rowCount - 1;
          const borderBottom = isLast ? '' : 'border-bottom:1px dashed #e2e8f0;';

          const hlClass = sf.isHighlighted ? 'td-highlight' : '';

          const tdIdx    = '';
          const tdClasif = isFirst ? `<td rowspan="${rowCount}" style="font-weight:700;text-transform:uppercase;font-size:7.5pt;text-align:left;vertical-align:middle;border-right:1px solid var(--color-border);">${fmt(g.tipo)}</td>` : '';
          const tdTotal  = isFirst ? `<td rowspan="${rowCount}" class="visita-cell" style="font-weight:800;vertical-align:middle;text-align:center;">${g.total}</td>` : '';

          return `<tr style="${borderBottom}">
            ${tdIdx}
            ${tdClasif}
            <td class="${hlClass}" style="text-align:center;font-size:7.5pt;color:#475569;">${sf.proceso ? `<span style="font-weight:700">${sf.proceso}</span>` : ''}</td>
            <td class="${hlClass}" style="font-weight:600;text-transform:uppercase;">${fmt(sf.color)}</td>
            <td class="${hlClass}" style="text-align:center;font-weight:600;">${sf.talla}</td>
            <td class="${hlClass}" style="text-align:center;">${sf.cantidad}</td>
            ${tdTotal}
          </tr>`;
        }).join('');
      }).join('');

      return `
        <div class="section-card">
          <div class="section-header">
            <h4><i class="fas fa-triangle-exclamation"></i> Hallazgos de Calidad</h4>
            <span class="badge-info">Afectación: ${totalDefectos} prendas ${tasaGlobal !== '—' ? '(' + tasaGlobal + ')' : ''}</span>
          </div>
          <table class="liquidacion-table">
            <thead>
              <tr>
                <th style="text-align:left;min-width:120px;">Clasificación</th>
                <th style="min-width:80px;text-align:center;">Proceso</th>
                <th style="min-width:70px;">Color</th>
                <th style="width:50px;text-align:center;">Talla</th>
                <th style="width:50px;text-align:center;">Cant.</th>
                <th style="width:50px;text-align:center;">Total</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
              <tr class="total-row">
                <td colspan="5" style="text-align:right;">TOTAL HALLAZGOS:</td>
                <td style="text-align:center;">${totalDefectos}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

            </div>
            <div class="data-grid" style="grid-template-columns: repeat(2, 1fr);">
              <div class="data-cell"><span class="lbl">Destino Planta</span><div class="val">${fmt(r.destinoPlanta || raw?.destino_planta)}</div></div>
              <div class="data-cell"><span class="lbl">Destino Proceso</span><div class="val">${fmt(r.destinoProceso || raw?.destino_proceso)}</div></div>
            </div>
          </div>

          <!-- 5. CURVA DE PRODUCCIÓN (Si aplica) -->
          ${renderCurva(r.curva, raw)}

          <!-- 6. REGISTRO DE HALLAZGOS Y DEFECTOS (Estilo liquidacion-table) -->
          ${renderHallazgos(r, raw)}

          <!-- 7. OBSERVACIONES Y CONCLUSIÓN (Estilo Summary Card) -->
          <div class="section-card">
            <div class="section-header">
              <h4><i class="fas fa-comment-dots"></i> Observaciones y Conclusión</h4>
            </div>
            <div class="obs-box" style="${(r.observaciones || raw?.observaciones) ? '' : 'color:#94a3b8;font-style:italic;'}">${(r.observaciones || raw?.observaciones || '').trim() || 'Sin observaciones adicionales registradas para este lote.'}</div>
          </div>

          <!-- 8. FIRMAS DE CONFORMIDAD -->
          <div class="section-card">
            <div class="section-header">
              <h4><i class="fas fa-signature"></i> Firmas de Conformidad</h4>
            </div>
            <div class="firmas-grid">
              <div class="firma-cell">
                <div class="firma-img-box">
                  ${renderFirmaHtml(auditorFirma, 'Registro Digital Verificado')}
                </div>
                <div class="firma-line"></div>
                <div class="firma-role">Auditor de Calidad</div>
                <div class="firma-name">${fmt(auditorNombre)}</div>
                ${(auditorCedula && auditorCedula !== '—' && auditorCedula !== 'N/A') ? `<div class="firma-cc">CC: ${fmt(auditorCedula)}</div>` : ''}
              </div>
              <div class="firma-cell">
                <div class="firma-img-box">
                  ${renderFirmaHtml(plantaFirma, 'Firma No Registrada')}
                </div>
                <div class="firma-line"></div>
                <div class="firma-role">Representante del Taller</div>
                <div class="firma-name">${fmt(plantaNombre)}</div>
                <div class="firma-cc">Taller / Confección</div>
              </div>
            </div>
          </div>

          <!-- 9. PIE DE PÁGINA -->
          <div class="doc-footer">
            <span>Radicado #${fmt(r.idReporte || raw?.id_reporte)} | Generado el ${new Date().toLocaleDateString('es-CO')}</span>
          </div>
        `;

      } catch (err) {
        console.error('[calidad-basica] Error:', err);
        app.innerHTML = `<p style="text-align:center;padding:40px;color:#dc2626;">Error al estructurar reporte: ${err.message}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
