<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calidad — Acceso</title>

    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --color-bg:           #ffffff;
    --color-surface:      #ffffff;
    --color-border:       #e2e8f0;
    --color-border-focus: #3f51b5;
    --color-text:         #0f172a;
    --color-text-muted:   #64748b;
    --color-text-light:   #94a3b8;
    --color-primary:      #3f51b5;
    --color-primary-dim:  rgba(63,81,181,.1);
    --color-primary-glow: rgba(63,81,181,.28);
    --color-error:        #dc2626;
    --color-error-dim:    rgba(220,38,38,.07);
    --color-success:      #16a34a;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --radius-sm: 11px;
    --radius-md: 22px;
    --transition: .2s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    width: 100%;
    background: #ffffff;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px 16px;
    background: #ffffff;
    touch-action: manipulation;
    position: relative;
    overflow: hidden;
}

input, textarea, select, button {
    font-family: inherit;
    touch-action: manipulation;
}

/* ── Card ── */
.login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 360px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    animation: rise .5s cubic-bezier(.22,1,.36,1) both;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Header con perfecta simetría ── */
.login-head {
    padding: 16px 28px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.login-logo {
    width: 76px;
    height: 76px;
    display: block;
    filter: drop-shadow(0 6px 16px rgba(63,81,181,.22));
    animation: float 4.5s ease-in-out infinite;
}

.login-app-name {
    width: 280px;
    height: 80px;
    display: block;
    margin-top: -10px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
}

/* ── Formulario ── */
.login-body {
    padding: 12px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 0;
}

.field { margin-bottom: 12px; }

.field-wrap { position: relative; }

.field-icon {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    display: flex; align-items: center;
    transition: color var(--transition);
}
.field-icon svg {
    width: 15px; height: 15px;
    stroke: var(--color-text-light); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: stroke var(--transition);
}
.field-wrap:focus-within .field-icon svg {
    stroke: var(--color-primary);
}

.field-input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: #ffffff;
    color: var(--color-text);
    font-size: .875rem;
    font-family: var(--font);
    font-weight: 400;
    letter-spacing: -0.01em;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
}
.field-input::placeholder { color: var(--color-text-light); font-weight: 400; letter-spacing: normal; }
.field-input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-dim);
    background: #ffffff;
}
.field-input-pw { padding-right: 42px; }

.pw-toggle {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--color-text-muted); padding: 4px;
    display: flex; align-items: center;
    transition: color var(--transition);
    border-radius: 6px;
}
.pw-toggle:hover { color: var(--color-text); }
.pw-toggle svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ── Error ── */
.err-box {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--color-error-dim);
    border: 1px solid rgba(220,38,38,.18);
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    animation: shake .3s ease;
}
.err-box.show { display: flex; }
@keyframes shake {
    0%,100%{ transform:translateX(0) }
    25%    { transform:translateX(-5px) }
    75%    { transform:translateX(5px) }
}
.err-box svg {
    width: 14px; height: 14px;
    stroke: var(--color-error); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
}
.err-txt { font-size: .78rem; color: var(--color-error); line-height: 1.3; }

/* ── Botón principal ── */
.btn-login {
    width: 100%;
    padding: 12px;
    background: #3f51b5;
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: .875rem;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: .01em;
    transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 4px 16px var(--color-primary-glow);
}
.btn-login:hover:not(:disabled) {
    opacity: .92;
    transform: translateY(-1px);
    box-shadow: 0 6px 22px var(--color-primary-glow);
}
.btn-login:active:not(:disabled){ transform: translateY(0); box-shadow: 0 2px 8px var(--color-primary-glow); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.btn-login svg {
    width: 15px; height: 15px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.btn-login.ok {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    box-shadow: 0 4px 16px rgba(22,163,74,.3);
}

/* Spinner */
.spin {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: rot .5s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ── Links de acceso ── */
.login-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 13px;
}
.forgot {
    display: inline-flex;
    align-items: center;
    font-size: .73rem;
    color: var(--color-text-muted);
    background: none; border: none;
    cursor: pointer; font-family: var(--font);
    padding: 0;
    transition: color var(--transition);
}
.forgot:hover { color: var(--color-primary); }
.links-sep {
    width: 1px;
    height: 12px;
    background: var(--color-border);
    flex-shrink: 0;
}

/* ── Footer ── */
.login-foot {
    padding: 12px 28px 20px;
    text-align: center;
    letter-spacing: .2px;
}
.foot-social-msg {
    font-size: .68rem;
    color: var(--color-text-muted);
    margin-bottom: 12px;
}
.foot-social {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 26px;
    margin-bottom: 14px;
}
.foot-social-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    transition: transform var(--transition);
}
.foot-social-item img {
    display: block;
    width: 20px;
    height: 20px;
    opacity: .7;
    transition: opacity var(--transition);
}
.foot-social-item span {
    display: block;
    font-size: .62rem;
    font-weight: 500;
    color: var(--color-text-light);
    transition: color var(--transition);
}
.foot-social-item:hover { transform: translateY(-2px); }
.foot-social-item:hover img { opacity: 1; }
.foot-social-item:hover span { color: var(--color-primary); }
.foot-dev {
    font-size: .64rem;
    font-weight: 500;
    color: var(--color-text-muted);
}

/* ── Vista biométrica ── */
.bm-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0 20px;
}
.bm-hero-icon {
    position: relative;
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
    color: var(--color-primary);
    margin-bottom: 14px;
}
.bm-hero-icon::before,
.bm-hero-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(63,81,181,.18);
    animation: bmPulse 2s ease-out infinite;
}
.bm-hero-icon::after {
    animation-delay: .6s;
}
/* Tercer anillo via box-shadow en el SVG wrapper */
.bm-hero-icon svg {
    position: relative;
    z-index: 1;
    width: 44px; height: 44px;
    filter: drop-shadow(0 0 0 rgba(63,81,181,0));
    animation: bmPulse3 2s ease-out infinite;
    animation-delay: 1.2s;
}
@keyframes bmPulse {
    0%   { transform: scale(.85); opacity: .7; }
    100% { transform: scale(1.9);  opacity: 0; }
}
@keyframes bmPulse3 {
    0%,40%,100% { filter: drop-shadow(0 0 0px rgba(63,81,181,0)); }
    20%          { filter: drop-shadow(0 0 8px rgba(63,81,181,.5)); }
}
.bm-hero-label {
    font-size: .78rem;
    color: var(--color-text-muted);
    font-weight: 500;
    letter-spacing: .02em;
}

/* Estado del proceso biométrico */
.bm-status {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: .875rem;
    font-weight: 600;
    color: var(--color-text-muted);
    margin-bottom: 4px;
}
.bm-status.ok    { color: var(--color-success); }
.bm-status.error { color: var(--color-error); }

/* ── Modal biometría (registro) ── */
.bm-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,23,42,.45);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
}
.bm-backdrop.open { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.bm-sheet {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 24px 24px 0 0;
    padding: 28px 28px calc(env(safe-area-inset-bottom, 0px) + 28px);
    animation: slideUp .3s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
}
.bm-handle {
    width: 40px; height: 4px;
    background: var(--color-border);
    border-radius: 2px;
    margin: 0 auto 24px;
}
.bm-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    background: var(--color-primary-dim);
    border-radius: 20px;
    color: var(--color-primary);
}
.bm-icon svg { width: 36px; height: 36px; }
.bm-title {
    font-size: 1.05rem; font-weight: 700;
    color: var(--color-text); text-align: center; margin-bottom: 8px;
}
.bm-desc {
    font-size: .82rem; color: var(--color-text-muted);
    text-align: center; line-height: 1.5; margin-bottom: 28px;
}
.bm-actions { display: flex; flex-direction: column; gap: 10px; }
.bm-btn-activate {
    width: 100%; padding: 13px;
    background: var(--color-primary); color: #fff;
    border: none; border-radius: var(--radius-sm);
    font-size: .9rem; font-weight: 700; font-family: var(--font);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity var(--transition);
    box-shadow: 0 4px 16px var(--color-primary-glow);
}
.bm-btn-activate:disabled { opacity: .5; cursor: not-allowed; }
.bm-btn-skip {
    width: 100%; padding: 11px;
    background: none; color: var(--color-text-muted);
    border: 1.5px solid var(--color-border); border-radius: var(--radius-sm);
    font-size: .85rem; font-weight: 600; font-family: var(--font);
    cursor: pointer; transition: color var(--transition), border-color var(--transition);
}
.bm-btn-skip:hover { color: var(--color-text); border-color: #cbd5e1; }

@media(max-width: 400px) {
    .login-head, .login-body, .login-foot { padding-left: 20px; padding-right: 20px; }
}
</style>

</head>
<body>

<div class="login-card">

    <div class="login-head">
        <svg class="login-logo" xmlns="http://www.w3.org/2000/svg" viewBox="99 88 826 842">
            <defs>
                <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="433" y1="929" x2="500" y2="94">
                    <stop offset="0" stop-color="#3f51b5"/>
                    <stop offset="1" stop-color="#3f51b5"/>
                </linearGradient>
            </defs>
            <path fill="url(#lg)" d="M501.29 94.22C502.23 94.18 503.17 94.14 504.11 94.12C610.95 90.39 714.86 129.47 792.76 202.68C874.77 279.04 922.28 385.41 924.41 497.45C927.94 610.9 886.34 721.12 808.73 803.95C735.84 880.85 628.02 926.37 522.38 929.03C415.75 931.76 312.19 893.19 233.33 821.37C147.09 742.19 103.37 637.2 99.56 521.11C97.15 417.07 135.16 308.02 205.34 230.91C285.17 143.21 383.61 99.15 501.29 94.22Z"/>
            <path fill="#ffffff" d="M510.87 287.56C527.52 288.88 525.41 303.77 525.84 316.38C528.13 382.25 623.34 399.94 619.09 467.96C617.74 489.49 608.71 505.94 592.93 520.23C604.6 532.92 603.67 539.23 591.4 550.72C591.81 562.3 591.05 574.53 591.73 586.02C600.19 586.5 609.92 586.3 618.47 586.31C630.02 586.4 641.56 586.31 653.1 586.04C653.82 580.16 653.75 565.84 653.44 559.88C647.17 552.63 646.74 549.39 653.01 542.34C642.17 531.17 635.91 522.68 634.62 506.26C631.52 469.09 670.72 455.69 686.32 428.35C690.95 420.24 689.24 403.06 691.36 393.95C692.41 389.46 696.25 384.77 701.29 385.11C714.3 386 711.67 402.81 713.15 411.8C714.16 419.04 715.9 426.11 720.92 431.77C741.72 455.22 782.51 475.25 773.53 512.71C770.39 525.8 764.82 532.35 755.16 541.29C761.85 548.54 761.98 552.26 755.47 559.41C754.7 567.95 755.03 581.69 755.03 590.51L755.03 645.47C755.03 654.76 755.29 664.18 754.62 673.44C754.28 678.15 750.38 682.18 745.61 682.38C737.49 682.72 729.27 682.55 721.12 682.54L672.32 682.48L514.25 682.48L348.91 682.47L301.32 682.5C293.69 682.51 285.38 682.77 277.8 682.26C274.06 682.01 272.15 678.75 270.07 675.87C269.1 664.49 269.69 649.89 269.56 638.28C269.25 612.39 269.96 586.14 269.51 560.28C267.14 557.17 265.62 555.39 264.04 551.82C265.78 546.92 266.21 546.13 269.62 542.54C258.93 532.49 251.34 523.21 250.02 508.09C246.73 470.66 288.25 455.03 306.15 429.27C313.73 418.35 308.54 398.31 316.05 388.61C317.6 386.78 319.6 385.7 321.91 385.55C333.45 384.78 333.13 398.3 332.88 406.71C332.16 431.12 345.62 440.58 362.21 455.64C375.82 468 390.73 482.69 390.86 502.65C391.01 521.53 383.15 530.76 371.14 543.41C377.71 550.4 376.97 552.81 371.25 559.95C370.8 568.12 371.04 577.96 371.06 586.25C378.09 586.35 429.76 587.2 431.74 585.21C434.47 582.47 433.44 555.82 433.31 550.62L429.86 547.16C419.91 537.21 422.74 529.06 432.01 520.39C420.23 508.05 412.29 497.75 408.42 480.77C393.16 413.94 462.62 396.06 490.08 347.94C495.17 338.89 496.25 328.71 497.34 318.62C498.63 306.63 495.7 291.04 510.87 287.56Z"/>
        </svg>
        <svg class="login-app-name" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
            <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#3f51b5">
                <tspan font-weight="300" letter-spacing="4">GRUPO</tspan>
                <tspan font-weight="900" letter-spacing="2">TDM</tspan>
            </text>
        </svg>
    </div>

    <div class="login-body">
        <form id="loginForm" novalidate>

            <!-- ── VISTA BIOMÉTRICA (se muestra si hay credencial guardada) ── -->
            <div id="bmView" style="display:none">
                <!-- Icono grande animado -->
                <div class="bm-hero" id="bmHero"></div>
                <!-- Estado del proceso (verificando / ok / reintento) -->
                <div class="bm-status" id="bmStatus"></div>
                <div class="err-box" id="errBox" role="alert">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span class="err-txt" id="errTxt"></span>
                </div>
                <div class="login-links" style="margin-top:16px">
                    <button type="button" class="forgot" id="switchToManualBtn">
                        Ingresar con contraseña
                    </button>
                    <span class="links-sep" aria-hidden="true"></span>
                    <button type="button" class="forgot" id="clearCredsBtn">
                        Eliminar credenciales
                    </button>
                </div>
            </div>

            <!-- ── VISTA MANUAL (formulario clásico) ── -->
            <div id="manualView">
                <div class="field">
                    <div class="field-wrap">
                        <div class="field-icon">
                            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                        <input type="email" id="f-email" class="field-input"
                               placeholder="Correo electrónico"
                               autocomplete="email" inputmode="email" spellcheck="false" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <div class="field-wrap">
                        <div class="field-icon">
                            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input type="password" id="f-pass" class="field-input field-input-pw"
                               placeholder="Contraseña"
                               autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="err-box" id="errBoxManual" role="alert">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span class="err-txt" id="errTxtManual"></span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    <span id="btnTxt">Ingresar</span>
                </button>

                <!-- Estado del proceso de login (éxito) -->
                <div class="bm-status" id="loginStatus" style="display:none"></div>

                <div class="login-links">
                    <button type="button" class="forgot" id="forgotBtn">
                        ¿Olvidaste tu contraseña?
                    </button>
                    <span class="links-sep" aria-hidden="true"></span>
                    <button type="button" class="forgot" id="clearCredsBtn2">
                        Eliminar credenciales
                    </button>
                </div>
            </div>

        </form>
    </div>

    <div class="login-foot">
    </div>

</div>

<!-- ── Modal de activación biométrica ── -->
<div class="bm-backdrop" id="bmBackdrop" role="dialog" aria-modal="true" aria-labelledby="bmTitle">
    <div class="bm-sheet">
        <div class="bm-handle" aria-hidden="true"></div>
        <div class="bm-icon" id="bmIcon"></div>
        <h2 class="bm-title" id="bmTitle">Activar Biometría</h2>
        <p class="bm-desc" id="bmDesc">

   - Si hay biometría guardada para algún usuario → vista biométrica

═══════════════════════════════════════════════════════════════ */
let _bmSupported = false;
let _bmEmail     = null;

(async function initView() {
    _bmSupported = await BM.isSupported();

    if (_bmSupported) {
        const map    = BM.getMap();
        const emails = Object.keys(map);
        if (emails.length > 0) {
            _bmEmail = emails[0];
            _showBmView(_bmEmail);
            // Auto-lanzar biometría tras un pequeño delay (la UI necesita renderizarse)
            setTimeout(() => _triggerBiometric(), 400);
            return;
        }
    }

    _showManualView();
})();

function _showBmView(email) {
    const label = BM.getLabel();
    const icon  = BM.getIcon();

    bmHero.innerHTML = `
        <div class="bm-hero-icon">${icon}</div>
        <span class="bm-hero-label">Verificando tu identidad...</span>
    `;
    _setBmStatus('verifying', label);

    // Pintar modal de enroll
    bmIcon.innerHTML = icon;
    bmTitle.textContent = `Activar ${label}`;
    bmDesc.textContent  = `Usa tu ${label} para ingresar más rápido la próxima vez.`;
    bmActivateTxt.textContent = `Activar ${label}`;

    bmView.style.display   = 'block';
    manualView.style.display = 'none';
}

function _setBmStatus(state, label) {
    const lbl = label || BM.getLabel();
    if (state === 'verifying') {
        bmStatus.className = 'bm-status';
        bmStatus.innerHTML = `<div style="width:15px;height:15px;flex-shrink:0;border:2px solid rgba(63,81,181,.2);border-top-color:#3f51b5;border-radius:50%;animation:rot .5s linear infinite"></div><span>Verificando ${lbl}...</span>`;
    } else if (state === 'ok') {
        bmStatus.className = 'bm-status ok';
        bmStatus.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>¡Bienvenido!</span>`;
    } else if (state === 'retry') {
        bmStatus.className = 'bm-status';
        bmStatus.innerHTML = `<span style="color:var(--color-text-muted);font-size:.8rem;cursor:pointer;text-decoration:underline" id="retryBmLink">Toca aquí para reintentar</span>`;
        document.getElementById('retryBmLink')?.addEventListener('click', () => {
            _setBmStatus('verifying', lbl);
            _triggerBiometric();
        });
    }
}

async function _triggerBiometric() {
    if (!_bmEmail) return;
    const credId = BM.getCredentialId(_bmEmail);
    if (!credId) return;

    hideErr();
    try {
        // 1. Verificar biometría en hardware (dispara el diálogo del SO)
        await BM.assertCredential(credId);

        // 2. Obtener sesión del servidor
        const res = await fetch(`${FUNCTIONS_URL}/biometric-auth`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'authenticate', email: _bmEmail, credential_id: credId }),
        });
        const result = await res.json();
        if (!res.ok || !result.success) throw new Error(result.error || 'Error en el servidor.');

        // 3. Establecer sesión
        const sb = getSB();
        if (!sb) throw new Error('Sin conexión al servidor.');
        const { error: sessErr } = await sb.auth.setSession(result.session);
        if (sessErr) throw sessErr;

        _setBmStatus('ok');
        setTimeout(_redirectAfterLogin, 600);

    } catch (err) {
        if (err.name === 'NotAllowedError') {
            // Usuario canceló → mostrar opción de reintentar
            _setBmStatus('retry');
        } else {
            showErr(err.message || 'Error biométrico. Intenta con contraseña.');
            _setBmStatus('retry');
        }
    }
}

function _showManualView() {
    bmView.style.display     = 'none';
    manualView.style.display = 'block';
    emailEl.focus();
}

function _redirectAfterLogin() {
    const dest = sessionStorage.getItem('auth_redirect') || 'index.html';
    sessionStorage.removeItem('auth_redirect');
    window.location.replace(/login/i.test(dest) ? 'index.html' : dest);
}

/* ── Botón "Ingresar con contraseña" ── */
switchToManualBtn.addEventListener('click', () => _showManualView());

/* ═══════════════════════════════════════════════════════════════
   MODAL DE ACTIVACIÓN BIOMÉTRICA (post login manual)
═══════════════════════════════════════════════════════════════ */
let _tempPass = null;

function _showBmModal(email) {
    // Pintar siempre el ícono/label del dispositivo actual al abrir el modal
    const label = BM.getLabel();
    const icon  = BM.getIcon();
    bmIcon.innerHTML          = icon;
    bmTitle.textContent       = `Activar ${label}`;
    bmDesc.textContent        = `Usa tu ${label} para ingresar más rápido la próxima vez.`;
    bmActivateTxt.textContent = `Activar ${label}`;

    bmBackdrop.classList.add('open');

    bmActivate.onclick = async () => {
        if (!_tempPass) { bmBackdrop.classList.remove('open'); showErrManual('Sesión expirada, inicia sesión de nuevo.'); return; }
        bmActivate.disabled = true;
        const spinEl = document.createElement('div');
        spinEl.className = 'spin';
        bmActivate.prepend(spinEl);
        bmActivateTxt.textContent = 'Activando...';

        try {
            const credId = await BM.createCredential(email);

            const res = await fetch(`${FUNCTIONS_URL}/biometric-auth`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'enroll', email, password: _tempPass, credential_id: credId }),
            });
            const result = await res.json();
            if (!res.ok || !result.success) throw new Error(result.error || 'Error en el servidor.');

            BM.saveCredential(email, credId);
            _tempPass = null;
            bmBackdrop.classList.remove('open');
            setOk(`${BM.getLabel()} activado`);
            setTimeout(_redirectAfterLogin, 700);

        } catch (err) {
            _tempPass = null;
            bmActivate.disabled = false;
            spinEl.remove();
            bmActivateTxt.textContent = `Activar ${BM.getLabel()}`;
            bmBackdrop.classList.remove('open');
            if (err.name !== 'NotAllowedError') showErrManual('No se pudo activar: ' + (err.message || 'Error desconocido.'));
            setTimeout(_redirectAfterLogin, 400);
        }
    };

    bmSkip.onclick = () => { _tempPass = null; bmBackdrop.classList.remove('open'); _redirectAfterLogin(); };
    bmBackdrop.onclick = (e) => { if (e.target === bmBackdrop) bmSkip.click(); };
}

forgotBtn.addEventListener('click', async () => {
    const email = emailEl.value.trim();
    if (!email || !email.includes('@')) {
        showErrManual('Ingresa tu correo primero.'); emailEl.focus(); return;
    }
    hideErrManual(); setLoading(true, 'Enviando...');
    try {
        const { error } = await getSB().auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/index.html'
        });
        if (error) throw error;
        setOk('¡Enlace enviado! Revisa tu correo.');
    } catch (_) {
        showErrManual('No se pudo enviar. Verifica el correo.');
        setLoading(false);
    }
});

/* ── Eliminar credenciales (vista biométrica) ── */
const clearCredsBtn = document.getElementById('clearCredsBtn');
if (clearCredsBtn) {
    clearCredsBtn.addEventListener('click', _clearAllCreds);
}

/* ── Eliminar credenciales (vista manual) ── */
const clearCredsBtn2 = document.getElementById('clearCredsBtn2');
if (clearCredsBtn2) {
    clearCredsBtn2.addEventListener('click', _clearAllCreds);
}

async function _clearAllCreds() {
    const inBmView = bmView.style.display !== 'none';
    const showMsg  = (m) => inBmView ? showErr(m) : showErrManual(m);

    // Indicar que está procesando
    showMsg('Eliminando credenciales...');

    // 1. Obtener access_token del localStorage ANTES de borrar nada
    let accessToken = null;
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.includes('-auth-token')) continue;
            const s = JSON.parse(localStorage.getItem(k) || 'null');
            if (s && s.access_token) { accessToken = s.access_token; break; }
        }
    } catch (_) {}

    // 2. Revocar en Supabase PRIMERO (esperar resultado)
    let revokeOk = false;
    const bmMap   = BM.getMap();
    const bmEmail = Object.keys(bmMap)[0] || '';
    const bmCred  = bmEmail ? bmMap[bmEmail] : '';

    if (bmCred) {
        try {
            // Intento A: revoke con token de sesión (más seguro)
            if (accessToken) {
                const res = await fetch(`${FUNCTIONS_URL}/biometric-auth`, {
                    method: 'POST',
                    headers: {
                        'Content-Type':  'application/json',
                        'Authorization': `Bearer ${accessToken}`,
                    },
                    body: JSON.stringify({ action: 'revoke', email: bmEmail, credential_id: bmCred }),
                });
                const rawA = await res.text();
                let resultA = {};
                try { resultA = JSON.parse(rawA); } catch (_) {}
                console.log('[BM] Revoke (token) status:', res.status, rawA);
                revokeOk = res.ok && resultA.success;
            }

            // Intento B: revoke_by_credential si A falló o no había token
            if (!revokeOk) {
                const res2 = await fetch(`${FUNCTIONS_URL}/biometric-auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'revoke_by_credential', email: bmEmail, credential_id: bmCred }),
                });
                const rawB = await res2.text();
                let resultB = {};
                try { resultB = JSON.parse(rawB); } catch (_) {}
                console.log('[BM] Revoke (credId) status:', res2.status, rawB);
                revokeOk = res2.ok && resultB.success;
            }
        } catch (e) {
            console.warn('[BM] Revoke error de red:', e);
        }
    } else {
        // Sin credential_id local no hay nada que revocar en Supabase
        revokeOk = true;
    }

    // 3. Solo si el revoke remoto fue exitoso (o no había sesión),
    //    limpiar localStorage y mapa local
    if (revokeOk) {
        let cleared = 0;
        for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && (k.includes('-auth-token') || k.startsWith('sb-'))) {
                localStorage.removeItem(k);
                cleared++;
            }
        }
        BM.clearAll();
        sessionStorage.clear();

        const msg = cleared > 0 ? `${cleared} credenciales eliminadas.` : 'Credenciales biométricas eliminadas.';
        showMsg(msg);
        setTimeout(() => window.location.reload(), 1200);
    } else {
        showMsg('No se pudo conectar con el servidor. Intenta de nuevo.');
    }
}

/* ── Submit (vista manual) ── */
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErrManual();
    const email = emailEl.value.trim();
    const pass  = passEl.value;
    if (!email || !pass)      return showErrManual('Completa todos los campos.');
    if (!email.includes('@')) return showErrManual('Ingresa un correo válido.');

    setLoading(true, 'Verificando...');
    try {
        const sb = getSB();
        if (!sb) throw new Error('Sin conexión al servidor.');
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        if (!data.session) throw new Error('No se pudo establecer la sesión.');

        _tempPass = pass;
        passEl.value = '';
        setOk('¡Bienvenido!');

        if (_bmSupported && !BM.hasCredential(email)) {
            setTimeout(() => _showBmModal(email), 800);
        } else {
            setTimeout(_redirectAfterLogin, 600);
        }

    } catch (err) {
        _tempPass = null;
        setLoading(false);
        passEl.value = ''; passEl.focus();
        const m = err.message || '';
        if (/invalid.login|invalid_credentials/i.test(m)) showErrManual('Correo o contraseña incorrectos.');
        else if (/not confirmed/i.test(m))                showErrManual('Confirma tu correo antes de ingresar.');
        else if (/too many|rate.limit/i.test(m))          showErrManual('Demasiados intentos. Espera un momento.');
        else if (/network|fetch|failed/i.test(m))         showErrManual('Sin conexión. Verifica tu red.');
        else showErrManual(m || 'Error al ingresar. Inténtalo de nuevo.');
    }
});

/* ── UI Helpers — vista biométrica ── */
function showErr(msg)    { errTxt.textContent = msg; errBox.className = 'err-box show'; }
function hideErr()       { errBox.className = 'err-box'; }

/* ── UI Helpers — vista manual ── */
const errBoxManual = document.getElementById('errBoxManual');
const errTxtManual = document.getElementById('errTxtManual');
function showErrManual(msg) { errTxtManual.textContent = msg; errBoxManual.className = 'err-box show'; }
function hideErrManual()    { errBoxManual.className = 'err-box'; }

function setLoading(on, label) {
    loginBtn.disabled = emailEl.disabled = passEl.disabled = on;
    loginBtn.style.display = on ? 'none' : '';
    
    const statusEl = document.getElementById('loginStatus');
    if (statusEl) {
        statusEl.style.display = on ? 'flex' : 'none';
        statusEl.className = 'bm-status';
        statusEl.innerHTML = on ? `<div class="spin" style="width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#64748b;"></div><span>${label}</span>` : '';
    }
}

function setOk(label) {
    loginBtn.style.display = 'none';
    
    const statusEl = document.getElementById('loginStatus');
    if (statusEl) {
        statusEl.style.display = 'flex';
        statusEl.className = 'bm-status ok';
        statusEl.innerHTML = `<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg><span>${label}</span>`;
    }
}
</script>
