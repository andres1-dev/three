    <!-- CSS crítico para pintar los esqueletos inmediatamente sin pantalla blanca -->
    <style id="critical-skeleton-css">
        @keyframes sk-shimmer {
            0%   { background-position: -600px 0; }
            100% { background-position:  600px 0; }
        }
        .sk-bar, .sk-cover, .sk-btn, .sk-accordion-row,
        .sk-p-bar, .sk-p-badge, .sk-app-icon, .sk-app-label {
            background: linear-gradient(90deg, #e8ecf0 25%, #f4f6f8 50%, #e8ecf0 75%);
            background-size: 1000px 100%;
            animation: sk-shimmer 1.6s infinite linear;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .sk-circle, .sk-p-circle {
            background: linear-gradient(90deg, #e8ecf0 25%, #f4f6f8 50%, #e8ecf0 75%);
            background-size: 1000px 100%;
            animation: sk-shimmer 1.6s infinite linear;
            border-radius: 50% !important;
            aspect-ratio: 1 / 1;
            clip-path: circle(50% at 50% 50%) !important;
            -webkit-clip-path: circle(50% at 50% 50%) !important;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sk-circle--avatar {
            width: 80px !important;
            height: 80px !important;
            min-width: 80px !important;
            min-height: 80px !important;
            border-radius: 50% !important;
        }
        .sk-avatar-wrap {
            margin-top: -36px;
            width: 80px;
            height: 80px;
            border-radius: 50% !important;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
            border: none !important;
            box-shadow: none !important;
        }
        .sk-avatar-wrap::after,
        .sk-avatar-wrap::before {
            display: none !important;
            content: none !important;
        }
    </style>

    <!-- Guard ultra-temprano sincrónico -->
    <script>
        (function () {
            var active = false;
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (!k || k.indexOf('-auth-token') === -1) continue;
                    var s = JSON.parse(localStorage.getItem(k) || 'null');
                    if (s && s.access_token) { active = true; break; }
                }
            } catch (_) {}

            if (!active) {
                sessionStorage.setItem('auth_redirect', window.location.href);
                window.location.replace('login.html');
            }
        })();
    </script>
