<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plump Color — Two Tone Explorer</title>

<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #f4f6fb;
    color: #202533;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #e7eaf0;
    padding: 18px 22px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.subtitle {
    margin-top: 4px;
    color: #737b8c;
    font-size: 13px;
}

.search {
    width: min(420px, 100%);
    height: 44px;
    border: 1px solid #dfe3eb;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px;
    outline: none;
    background: white;
}

.search:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 0 4px rgba(108,99,255,.10);
}

/* PALETTE */

.palette-bar {
    padding: 15px 22px;
    background: white;
    border-bottom: 1px solid #e7eaf0;
}

.palette-title {
    font-size: 12px;
    font-weight: 800;
    color: #7a8190;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 10px;
}

.palettes {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.palette-btn {
    border: 2px solid transparent;
    background: #f5f6fa;
    border-radius: 12px;
    padding: 7px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 700;
}

.palette-btn.active {
    border-color: #202533;
    background: white;
}

.duo {
    display: flex;
    overflow: hidden;
    border-radius: 50%;
    width: 22px;
    height: 22px;
}

.duo span {
    flex: 1;
}

/* CONTROLS */

.controls {
    padding: 14px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.counter {
    color: #747c8d;
    font-size: 13px;
}

button.control {
    border: 0;
    border-radius: 10px;
    background: #202533;
    color: white;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 700;
}

button.control:hover {
    opacity: .88;
}

/* GRID */

.grid {
    padding: 8px 22px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
}

.icon-card {
    background: white;
    border: 1px solid #e8ebf1;
    border-radius: 18px;
    padding: 14px;
    transition: .18s ease;
    min-width: 0;
}

.icon-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(35,40,55,.10);
}

.icon-name {
    font-size: 11px;
    color: #70788a;
    margin-bottom: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* VERSIONS */

.versions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.version {
    height: 66px;
    border-radius: 12px;
    background: #f7f8fb;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .15s;
    position: relative;
}

.version:hover {
    background: #eef0f6;
    transform: scale(1.04);
}

.version svg {
    width: 43px;
    height: 43px;
}

.version-label {
    position: absolute;
    bottom: 3px;
    right: 5px;
    font-size: 7px;
    color: #9aa1ae;
    font-weight: 700;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 60px;
    color: #7b8392;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #e5e7ee;
    border-top-color: #6c63ff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: auto auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,18,27,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(650px, 100%);
    background: white;
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 30px 80px rgba(0,0,0,.25);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close {
    border: 0;
    background: #f1f2f6;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.preview-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.preview {
    height: 125px;
    border-radius: 18px;
    background: #f7f8fb;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.preview svg {
    width: 85px;
    height: 85px;
}

.preview-name {
    font-size: 10px;
    text-align: center;
    color: #777f8f;
    margin-top: 7px;
}

/* RESPONSIVE */

@media(max-width:600px) {

    .header {
        padding: 15px;
    }

    .palette-bar {
        padding: 13px 15px;
    }

    .controls {
        padding: 12px 15px;
    }

    .grid {
        padding: 5px 15px 30px;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .icon-card {
        padding: 10px;
        border-radius: 15px;
    }

    .versions {
        gap: 5px;
    }

    .version {
        height: 58px;
    }

    .version svg {
        width: 38px;
        height: 38px;
    }

    .preview-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-top">

        <div>
            <div class="title">
                Plump Color Explorer
            </div>

            <div class="subtitle">
                Iconos Plump · 2 tonos · múltiples colores
            </div>
        </div>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Buscar icono..."
        >

    </div>

</header>


<section class="palette-bar">

    <div class="palette-title">
        Colores
    </div>

    <div class="palettes" id="palettes"></div>

</section>


<section class="controls">

    <div class="counter" id="counter">
        Cargando iconos...
    </div>

    <button class="control" onclick="randomIcon()">
        🎲 Aleatorio
    </button>

</section>


<main>

    <div id="loading" class="loading">

        <div class="spinner"></div>

        Cargando colección Plump Color...

    </div>

    <div id="grid" class="grid"></div>

</main>


<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <div>
                <strong id="modalTitle">
                    Icono
                </strong>

                <div class="subtitle">
                    Haz clic en una versión para copiar el SVG
                </div>
            </div>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <div id="modalGrid" class="preview-grid"></div>

    </div>

</div>


<script>

const PREFIX = "streamline-plump-color";

const palettes = {

    "Morado": {
        light: "#9B8AFB",
        dark: "#6254D9"
    },

    "Azul": {
        light: "#6EA8FE",
        dark: "#3D6FD8"
    },

    "Celeste": {
        light: "#8ED8FF",
        dark: "#399ACF"
    },

    "Verde": {
        light: "#70D9A5",
        dark: "#35A96F"
    },

    "Turquesa": {
        light: "#72DDD5",
        dark: "#35AAA2"
    },

    "Naranja": {
        light: "#FFB86B",
        dark: "#E47A20"
    },

    "Rojo": {
        light: "#FF8A9B",
        dark: "#D94D62"
    },

    "Rosa": {
        light: "#F7A6D2",
        dark: "#D85D9F"
    },

    "Amarillo": {
        light: "#FFE083",
        dark: "#D9A900"
    }

};


let selectedPalette = "Morado";
let icons = [];
let filteredIcons = [];
let cache = new Map();


/* ================================
   PALETAS
================================ */

function renderPalettes() {

    const container = document.getElementById("palettes");

    container.innerHTML = "";

    Object.entries(palettes).forEach(([name, colors]) => {

        const button = document.createElement("button");

        button.className =
            "palette-btn " +
            (name === selectedPalette ? "active" : "");

        button.innerHTML = `

            <span class="duo">

                <span style="background:${colors.light}"></span>

                <span style="background:${colors.dark}"></span>

            </span>

            ${name}

        `;

        button.onclick = () => {

            selectedPalette = name;

            renderPalettes();

            renderGrid();

        };

        container.appendChild(button);

    });

}


/* ================================
   CARGAR COLECCIÓN
================================ */

async function loadCollection() {

    try {

        const response = await fetch(
            `https://api.iconify.design/collection?prefix=${PREFIX}`
        );

        const data = await response.json();

        icons = data.uncategorized || [];

        /*
         * Algunas colecciones utilizan categorías.
         * Por eso recorremos también las categorías.
         */

        if (data.categories) {

            Object.values(data.categories).forEach(list => {

                icons.push(...list);

            });

        }

        icons = [...new Set(icons)].sort();

        filteredIcons = [...icons];

        document.getElementById("loading").style.display = "none";

        updateCounter();

        renderGrid();

    } catch (error) {

        console.error(error);

        document.getElementById("loading").innerHTML = `
            <strong>No se pudo cargar la colección.</strong>
            <br><br>
            Verifica tu conexión a internet.
        `;

    }

}


/* ================================
   OBTENER SVG
================================ */

async function getSVG(iconName) {

    const key = iconName;

    if (cache.has(key)) {

        return cache.get(key);

    }

    const url =
        `https://api.iconify.design/${PREFIX}/${encodeURIComponent(iconName)}.svg`;

    const response = await fetch(url);

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar " + iconName
        );

    }

    const svg = await response.text();

    cache.set(key, svg);

    return svg;

}


/* ================================
   COLOR
================================ */

function hexToRgb(hex) {

    hex = hex.replace("#", "");

    if (hex.length === 3) {

        hex =
            hex[0] + hex[0] +
            hex[1] + hex[1] +
            hex[2] + hex[2];

    }

    return {

        r: parseInt(hex.substring(0, 2), 16),

        g: parseInt(hex.substring(2, 4), 16),

        b: parseInt(hex.substring(4, 6), 16)

    };

}


function luminance(hex) {

    const rgb = hexToRgb(hex);

    return (
        rgb.r * 0.299 +
        rgb.g * 0.587 +
        rgb.b * 0.114
    );

}


/*
 * Extrae los colores que realmente existen
 * dentro del SVG original.
 */

function extractColors(svg) {

    const colors = new Set();

    const regex =
        /#[0-9a-fA-F]{3,8}/g;

    const matches =
        svg.match(regex) || [];

    matches.forEach(color => {

        if (
            color.length === 4 ||
            color.length === 7
        ) {

            colors.add(color.toUpperCase());

        }

    });

    return [...colors];

}


/*
 * Esta es la parte importante:
 *
 * NO pintamos cada path con un color diferente.
 *
 * Detectamos los tonos originales del Plump
 * y los convertimos en:
 *
 *     TONO CLARO
 *     TONO OSCURO
 *
 */

function recolorSVG(svg, palette) {

    const originalColors =
        extractColors(svg);

    if (!originalColors.length) {

        return svg;

    }


    /*
     * Ordenamos por luminosidad.
     */

    const sorted =
        [...originalColors].sort(
            (a, b) =>
                luminance(a) -
                luminance(b)
        );


    /*
     * El tono más oscuro representa sombras
     * y detalles.
     */

    const darkReference =
        sorted[0];


    /*
     * El más claro representa las zonas
     * principales.
     */

    const lightReference =
        sorted[sorted.length - 1];


    /*
     * Si solamente existe un color,
     * usamos ese color como base y
     * hacemos una separación sencilla.
     */

    if (originalColors.length === 1) {

        return svg
            .replaceAll(
                originalColors[0],
                palette.light
            );

    }


    let result = svg;

    originalColors.forEach(color => {

        let replacement;

        if (color === darkReference) {

            replacement = palette.dark;

        } else {

            replacement = palette.light;

        }

        const regex =
            new RegExp(
                color,
                "gi"
            );

        result =
            result.replace(
                regex,
                replacement
            );

    });

    return result;

}


/* ================================
   SVG DOM
================================ */

function svgElement(svgText) {

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            svgText,
            "image/svg+xml"
        );

    const svg =
        doc.documentElement;

    svg.setAttribute(
        "width",
        "100%"
    );

    svg.setAttribute(
        "height",
        "100%"
    );

    svg.setAttribute(
        "preserveAspectRatio",
        "xMidYMid meet"
    );

    return svg;

}


/* ================================
   ICONO RECOLORIZADO
================================ */

async function createIcon(iconName) {

    const original =
        await getSVG(iconName);

    const palette =
        palettes[selectedPalette];

    const recolored =
        recolorSVG(
            original,
            palette
        );

    return svgElement(
        recolored
    );

}


/* ================================
   CARD
================================ */

async function createCard(iconName) {

    const card =
        document.createElement("div");

    card.className =
        "icon-card";

    card.innerHTML = `

        <div class="icon-name"
             title="${iconName}">
            ${iconName}
        </div>

        <div class="versions"></div>

    `;

    const versions =
        card.querySelector(".versions");

    const paletteEntries =
        Object.entries(palettes);


    /*
     * Mostramos TODAS las paletas
     * simultáneamente.
     */

    for (
        let i = 0;
        i < paletteEntries.length;
        i++
    ) {

        const [name, palette] =
            paletteEntries[i];

        const version =
            document.createElement("div");

        version.className =
            "version";

        version.title =
            `${iconName} — ${name}`;

        try {

            const original =
                await getSVG(iconName);

            const recolored =
                recolorSVG(
                    original,
                    palette
                );

            const svg =
                svgElement(
                    recolored
                );

            version.appendChild(svg);

        } catch {

            version.textContent = "×";

        }


        const label =
            document.createElement("span");

        label.className =
            "version-label";

        label.textContent =
            name;

        version.appendChild(label);


        version.onclick = () => {

            openModal(
                iconName
            );

        };


        versions.appendChild(
            version
        );

    }

    return card;

}


/* ================================
   GRID
================================ */

async function renderGrid() {

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";

    /*
     * Cargamos primero un bloque para que
     * la página no intente renderizar miles
     * de SVG simultáneamente.
     */

    const batchSize = 30;

    for (
        let start = 0;
        start < filteredIcons.length;
        start += batchSize
    ) {

        const batch =
            filteredIcons.slice(
                start,
                start + batchSize
            );

        const cards =
            await Promise.all(
                batch.map(
                    createCard
                )
            );

        cards.forEach(card => {

            grid.appendChild(card);

        });

        /*
         * Permite que el navegador respire
         * antes del siguiente bloque.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    10
                )
        );

    }

    updateCounter();

}


/* ================================
   BUSCAR
================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();

            if (!query) {

                filteredIcons =
                    [...icons];

            } else {

                filteredIcons =
                    icons.filter(
                        icon =>
                            icon
                                .toLowerCase()
                                .includes(query)
                    );

            }

            renderGrid();

        }
    );


/* ================================
   CONTADOR
================================ */

function updateCounter() {

    document.getElementById(
        "counter"
    ).textContent =
        `${filteredIcons.length.toLocaleString()} iconos encontrados · ${Object.keys(palettes).length} colores por icono`;

}


/* ================================
   RANDOM
================================ */

function randomIcon() {

    if (!icons.length) return;

    const index =
        Math.floor(
            Math.random() *
            icons.length
        );

    const name =
        icons[index];

    document
        .getElementById("search")
        .value = name;

    filteredIcons =
        [name];

    renderGrid();

}


/* ================================
   MODAL
================================ */

async function openModal(iconName) {

    const modal =
        document.getElementById(
            "modal"
        );

    const modalGrid =
        document.getElementById(
            "modalGrid"
        );

    document.getElementById(
        "modalTitle"
    ).textContent =
        iconName;

    modalGrid.innerHTML = "";

    modal.classList.add(
        "show"
    );


    const original =
        await getSVG(iconName);


    for (
        const [name, palette]
        of Object.entries(palettes)
    ) {

        const wrapper =
            document.createElement(
                "div"
            );

        const preview =
            document.createElement(
                "div"
            );

        preview.className =
            "preview";

        const recolored =
            recolorSVG(
                original,
                palette
            );

        const svg =
            svgElement(
                recolored
            );

        preview.appendChild(svg);

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "preview-name";

        label.textContent =
            name;


        preview.onclick =
            () => {

                copySVG(
                    recolored
                );

            };


        wrapper.appendChild(
            preview
        );

        wrapper.appendChild(
            label
        );

        modalGrid.appendChild(
            wrapper
        );

    }

}


/* ================================
   CERRAR MODAL
================================ */

function closeModal() {

    document
        .getElementById("modal")
        .classList.remove(
            "show"
        );

}


document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target === this
            ) {

                closeModal();

            }

        }
    );


/* ================================
   COPIAR SVG
================================ */

async function copySVG(svgText) {

    try {

        await navigator.clipboard.writeText(
            svgText
        );

        alert(
            "SVG copiado al portapapeles ✓"
        );

    } catch {

        alert(
            "No se pudo copiar automáticamente."
        );

    }

}


/* ================================
   INICIO
================================ */

renderPalettes();

loadCollection();

</script>

</body>
</html>
