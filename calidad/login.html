<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calidad — Acceso</title>
    <link rel="icon" href="icons/favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* ── Tokens (igual que styles.css) ── */
:root {
    --color-bg:         #ffffff;
    --color-surface:    #ffffff;
    --color-border:     #e2e8f0;
    --color-text:       #1e293b;
    --color-text-muted: #64748b;
    --color-text-light: #94a3b8;
    --color-primary:    #3b82f6;
    --color-primary-dim:rgba(59,130,246,.1);
    --color-primary-glow:rgba(59,130,246,.25);
    --color-error:      #dc2626;
    --color-error-dim:  rgba(220,38,38,.07);
    --font: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    --radius-sm:  8px;
    --radius-md:  16px;
    --radius-full:999px;
    --shadow-md:  0 6px 18px rgba(0,0,0,.06), 0 2px 6px rgba(0,20,40,.04);
    --shadow-lg:  0 16px 32px -8px rgba(0,0,0,.1), 0 6px 14px rgba(0,0,0,.04);
    --transition: .15s ease;
}

*, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #ffffff;
}

/* ── Card central ── */
.login-card {
    width: 100%;
    max-width: 360px;
    background: #ffffff;
    border: none;
    border-radius: var(--radius-md);
    box-shadow: none;
    overflow: hidden;
    animation: rise .4s cubic-bezier(.22,1,.36,1) both;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Header ── */
.login-head {
    padding: 28px 28px 8px;
    text-align: center;
}

/* Logo SVG de Grupo TDM embebido */
.login-logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 6px;
    display: block;
}

.login-app-name {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--color-primary);
    margin-bottom: 0;
}

/* ── Formulario ── */
.login-body {
    padding: 24px 28px 28px;
}

.field { margin-bottom: 12px; }

.field-wrap { position: relative; }

.field-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    display: flex; align-items: center;
}
.field-icon svg {
    width: 15px; height: 15px;
    stroke: var(--color-text-light); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

.field-input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: .875rem;
    font-family: var(--font);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
}
.field-input::placeholder { color: var(--color-text-light); }
.field-input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-dim);
}
.field-input:focus + .field-icon svg,
.field-input:focus ~ .field-icon svg {
    stroke: var(--color-primary);
}
.field-input-pw { padding-right: 40px; }

.pw-toggle {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--color-text-muted); padding: 2px;
    display: flex; align-items: center;
    transition: color var(--transition);
}
.pw-toggle:hover { color: var(--color-text); }
.pw-toggle svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}

/* ── Error ── */
.err-box {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--color-error-dim);
    border: 1px solid rgba(220,38,38,.2);
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    animation: shake .3s ease;
}
.err-box.show { display: flex; }
@keyframes shake {
    0%,100%{ transform:translateX(0) }
    25%    { transform:translateX(-5px) }
    75%    { transform:translateX(5px) }
}
.err-box svg {
    width: 14px; height: 14px;
    stroke: var(--color-error); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
}
.err-txt { font-size: .78rem; color: var(--color-error); line-height: 1.3; }

/* ── Botón principal — igual al btn-primary del index ── */
.btn-login {
    width: 100%;
    padding: 11px;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: .875rem;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity var(--transition), transform var(--transition);
    box-shadow: 0 2px 8px var(--color-primary-glow);
}
.btn-login:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
.btn-login:active:not(:disabled){ transform: translateY(0); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.btn-login svg {
    width: 15px; height: 15px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.btn-login.ok { background: #22c55e; box-shadow: 0 2px 8px rgba(34,197,94,.25); }

/* Spinner */
.spin {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: rot .5s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ── Forgot ── */
.forgot {
    display: block;
    text-align: center;
    margin-top: 12px;
    font-size: .73rem;
    color: var(--color-text-muted);
    background: none; border: none;
    cursor: pointer; font-family: var(--font);
    transition: color var(--transition);
}
.forgot:hover { color: var(--color-primary); }

/* ── Footer ── */
.login-foot {
    padding: 12px 28px;
    border-top: 1px solid var(--color-border);
    text-align: center;
    font-size: .65rem;
    color: var(--color-text-light);
}

@media(max-width: 400px) {
    .login-head, .login-body, .login-foot { padding-left: 20px; padding-right: 20px; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ── Guard: sesión activa → index.html ── */
(function () {
    sessionStorage.removeItem('_auth_redirecting');
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.includes('-auth-token')) continue;
            const s = JSON.parse(localStorage.getItem(k) || 'null');
            if (s && s.access_token) {
                const dest = sessionStorage.getItem('auth_redirect') || 'index.html';
                sessionStorage.removeItem('auth_redirect');
                window.location.replace(/login/i.test(dest) ? 'index.html' : dest);
                return;
            }
        }
    } catch (_) {}
})();

/* ── Cliente Supabase ── */
function getSB() {
    if (window._sb) return window._sb;
    if (typeof window.supabase === 'undefined') return null;
    window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });
    return window._sb;
}

/* ── DOM ── */
const form      = document.getElementById('loginForm');
const emailEl   = document.getElementById('f-email');
const passEl    = document.getElementById('f-pass');
const loginBtn  = document.getElementById('loginBtn');
const errBox    = document.getElementById('errBox');
const errTxt    = document.getElementById('errTxt');
const pwToggle  = document.getElementById('pwToggle');
const eyeIcon   = document.getElementById('eyeIcon');
const forgotBtn = document.getElementById('forgotBtn');

/* ── Toggle contraseña ── */
let pwVisible = false;
pwToggle.addEventListener('click', () => {
    pwVisible = !pwVisible;
    passEl.type = pwVisible ? 'text' : 'password';
    eyeIcon.innerHTML = pwVisible
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
});

/* ── Recuperar contraseña ── */
forgotBtn.addEventListener('click', async () => {
    const email = emailEl.value.trim();
    if (!email || !email.includes('@')) {
        showErr('Ingresa tu correo primero.'); emailEl.focus(); return;
    }
    hideErr(); setLoading(true, 'Enviando...');
    try {
        const { error } = await getSB().auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/index.html'
        });
        if (error) throw error;
        setOk('¡Enlace enviado! Revisa tu correo.');
    } catch (_) {
        showErr('No se pudo enviar. Verifica el correo.');
        setLoading(false);
    }
});

/* ── Submit ── */
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const email = emailEl.value.trim();
    const pass  = passEl.value;
    if (!email || !pass)      return showErr('Completa todos los campos.');
    if (!email.includes('@')) return showErr('Ingresa un correo válido.');

    setLoading(true, 'Verificando...');
    try {
        const sb = getSB();
        if (!sb) throw new Error('Sin conexión al servidor.');
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        if (!data.session) throw new Error('No se pudo establecer la sesión.');
        passEl.value = '';
        setOk('¡Bienvenido!');
        setTimeout(() => {
            const dest = sessionStorage.getItem('auth_redirect') || 'index.html';
            sessionStorage.removeItem('auth_redirect');
            window.location.replace(/login/i.test(dest) ? 'index.html' : dest);
        }, 600);
    } catch (err) {
        setLoading(false);
        passEl.value = ''; passEl.focus();
        const m = err.message || '';
        if (/invalid.login|invalid_credentials/i.test(m)) showErr('Correo o contraseña incorrectos.');
        else if (/not confirmed/i.test(m))                 showErr('Confirma tu correo antes de ingresar.');
        else if (/too many|rate.limit/i.test(m))           showErr('Demasiados intentos. Espera un momento.');
        else if (/network|fetch|failed/i.test(m))          showErr('Sin conexión. Verifica tu red.');
        else showErr(m || 'Error al ingresar. Inténtalo de nuevo.');
    }
});

/* ── UI helpers ── */
function showErr(msg) { errTxt.textContent = msg; errBox.className = 'err-box show'; }
function hideErr()    { errBox.className = 'err-box'; }

function setLoading(on, label) {
    loginBtn.disabled = emailEl.disabled = passEl.disabled = on;
    loginBtn.className = 'btn-login';
    loginBtn.innerHTML = on
        ? `<div class="spin"></div><span>${label}</span>`
        : `<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span>Ingresar</span>`;
}

function setOk(label) {
    loginBtn.disabled = true;
    loginBtn.className = 'btn-login ok';
    loginBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg><span>${label}</span>`;
}
