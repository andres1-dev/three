<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Streamline Icon Explorer
</title>

<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

:root {

    --background: #f4f5f7;
    --card: #ffffff;

    --text: #30313a;
    --muted: #737687;

    --primary: #4b6fe8;

}

body {

    margin: 0;

    background: var(--background);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

}


/* =====================================================
   CONTENEDOR
===================================================== */

.container {

    width: min(1100px, 100%);

    margin: auto;

    padding:
        35px
        25px
        80px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-end;

    gap: 20px;

    margin-bottom: 25px;

}

h1 {

    margin: 0;

    font-size: 38px;

    letter-spacing: -1px;

}

.subtitle {

    margin:
        7px
        0
        0;

    color: var(--muted);

}

.total {

    color:
        var(--primary);

    font-weight:
        700;

}


/* =====================================================
   SELECTOR
===================================================== */

.collections {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 15px;

}

.collection-btn {

    height: 44px;

    padding:
        0
        16px;

    border: 0;

    border-radius: 12px;

    background: white;

    color: #5e6272;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(30,35,50,.05);

}

.collection-btn.active {

    background:
        var(--primary);

    color: white;

}


/* =====================================================
   BUSCADOR
===================================================== */

.toolbar {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 20px;

}

.search {

    flex: 1;

    min-width: 230px;

    height: 48px;

    border:
        1px solid #e0e2e8;

    border-radius: 14px;

    padding:
        0
        16px;

    font-size: 15px;

    outline: none;

    background: white;

}

.search:focus {

    border-color:
        #9caef4;

}

.action {

    height: 48px;

    padding:
        0
        17px;

    border: 0;

    border-radius: 13px;

    background: white;

    font-weight: 700;

    color: #55596a;

    cursor: pointer;

}

.action.primary {

    background:
        var(--primary);

    color: white;

}


/* =====================================================
   VISOR
===================================================== */

.viewer {

    min-height:
        530px;

    background: white;

    border-radius: 30px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 40px;

    box-shadow:
        0 12px 40px
        rgba(30,35,50,.06);

}


/* =====================================================
   ICONO
===================================================== */

.icon-card {

    width: 260px;

    height: 260px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: white;

    border-radius: 45px;

    box-shadow:
        0 15px 40px
        rgba(30,35,50,.08);

}

iconify-icon {

    font-size: 165px;

}


/* =====================================================
   INFORMACIÓN
===================================================== */

.icon-name {

    margin-top: 28px;

    font-size: 25px;

    font-weight: 750;

    text-align: center;

    max-width: 90%;

    word-break: break-word;

}

.icon-code {

    margin-top: 8px;

    font-family:
        monospace;

    font-size: 13px;

    color:
        #858898;

    text-align: center;

    max-width: 95%;

    word-break: break-all;

}

.variant {

    margin-top: 8px;

    padding:
        5px
        10px;

    border-radius: 20px;

    background:
        #f0f2f8;

    color:
        #64697a;

    font-size: 12px;

    font-weight: 700;

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

.navigation {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

}

.navigation button {

    min-width: 110px;

    height: 46px;

    border: 0;

    border-radius: 13px;

    background: white;

    color: #55596a;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 15px
        rgba(30,35,50,.05);

}

.position {

    min-width: 130px;

    text-align: center;

    color:
        var(--muted);

    font-weight: 700;

}


/* =====================================================
   INFO
===================================================== */

.info {

    margin-top: 20px;

    background: white;

    border-radius: 15px;

    padding: 14px 18px;

    color:
        var(--muted);

    font-size: 13px;

    text-align: center;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .container {

        padding:
            25px
            15px
            60px;

    }

    .header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }

    h1 {

        font-size: 30px;

    }

    .viewer {

        min-height:
            430px;

        border-radius:
            24px;

        padding:
            25px;

    }

    .icon-card {

        width: 190px;

        height: 190px;

        border-radius:
            32px;

    }

    iconify-icon {

        font-size:
            120px;

    }

    .icon-name {

        font-size:
            21px;

    }

    .navigation {

        gap: 6px;

    }

    .navigation button {

        min-width:
            82px;

        padding:
            0
            10px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header">

        <div>

            <h1>
                Streamline Icons
            </h1>

            <div class="subtitle">
                Explorador completo de iconos
            </div>

        </div>

        <div
            class="total"
            id="total">

            Cargando...

        </div>

    </div>



    <!-- =================================================
         COLECCIONES
    ================================================== -->

    <div class="collections">

        <button
            class="collection-btn active"
            data-set="streamline-color">

            Color · 2.000

        </button>


        <button
            class="collection-btn"
            data-set="streamline-plump-color">

            Plump Color · 1.000

        </button>


        <button
            class="collection-btn"
            data-set="streamline">

            Normal · 3.000

        </button>


        <button
            class="collection-btn"
            data-set="ALL">

            TODAS

        </button>

    </div>



    <!-- =================================================
         BUSCADOR
    ================================================== -->

    <div class="toolbar">

        <input
            class="search"
            id="search"
            type="search"
            placeholder="Buscar: user, calendar, heart, rocket, home..."
        >


        <button
            class="action primary"
            id="random">

            🎲 Aleatorio

        </button>


        <button
            class="action"
            id="copy">

            📋 Copiar

        </button>

    </div>



    <!-- =================================================
         VISOR
    ================================================== -->

    <section class="viewer">


        <div class="icon-card">

            <iconify-icon
                id="icon"
                icon="streamline-color:add-1">
            </iconify-icon>

        </div>


        <div
            class="icon-name"
            id="name">

            add-1

        </div>


        <div
            class="icon-code"
            id="code">

            streamline-color:add-1

        </div>


        <div
            class="variant"
            id="variant">

            NORMAL

        </div>


        <!-- =================================================
             NAVEGACIÓN
        ================================================== -->

        <div class="navigation">

            <button
                id="previous">

                ← Anterior

            </button>


            <div
                class="position"
                id="position">

                1 / ...

            </div>


            <button
                id="next">

                Siguiente →

            </button>

        </div>


    </section>



    <!-- =================================================
         INFORMACIÓN
    ================================================== -->

    <div
        class="info"
        id="info">

        Cargando colección...

    </div>


</div>



<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */


const SETS = {

    "streamline-color": {

        name:
            "Streamline Color",

        count:
            2000

    },


    "streamline-plump-color": {

        name:
            "Streamline Plump Color",

        count:
            1000

    },


    "streamline": {

        name:
            "Streamline",

        count:
            3000

    }

};


/* =====================================================
   VARIABLES
===================================================== */

let currentSet =
    "streamline-color";


let currentIcons =
    [];


let currentIndex =
    0;


let cache =
    {};


/* =====================================================
   ELEMENTOS
===================================================== */

const icon =
    document.getElementById("icon");

const name =
    document.getElementById("name");

const code =
    document.getElementById("code");

const variant =
    document.getElementById("variant");

const position =
    document.getElementById("position");

const total =
    document.getElementById("total");

const info =
    document.getElementById("info");

const search =
    document.getElementById("search");


/* =====================================================
   CARGAR COLECCIÓN
===================================================== */

async function loadSet(setName) {


    if (cache[setName]) {

        return cache[setName];

    }


    const url =
        `https://api.iconify.design/collection?prefix=${setName}`;


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let icons =
            [];


        /*
         ================================================
         ICONOS SIN CATEGORÍA
         ================================================
        */

        if (
            Array.isArray(
                data.uncategorized
            )
        ) {

            icons.push(
                ...data.uncategorized
            );

        }


        /*
         ================================================
         CATEGORÍAS
         ================================================
        */

        if (data.categories) {

            Object.values(
                data.categories
            ).forEach(list => {

                if (
                    Array.isArray(list)
                ) {

                    icons.push(
                        ...list
                    );

                }

            });

        }


        /*
         ================================================
         ELIMINAR DUPLICADOS
         ================================================
        */

        icons =
            [
                ...new Set(icons)
            ];


        /*
         ================================================
         ORDENAR
         ================================================
        */

        icons.sort(
            (a,b) =>
                a.localeCompare(b)
        );


        cache[setName] =
            icons;


        return icons;

    }

    catch(error) {

        console.error(
            error
        );

        return [];

    }

}


/* =====================================================
   CARGAR TODAS
===================================================== */

async function loadAll() {


    info.textContent =
        "Cargando TODAS las colecciones...";


    const names =
        Object.keys(SETS);


    const results =
        await Promise.all(

            names.map(
                set =>
                    loadSet(set)
            )

        );


    let all =
        [];


    results.forEach(
        (icons, i) => {

            const set =
                names[i];


            icons.forEach(
                iconName => {

                    all.push({

                        set:
                            set,

                        name:
                            iconName

                    });

                }

            );

        }
    );


    return all;

}


/* =====================================================
   CAMBIAR COLECCIÓN
===================================================== */

async function changeCollection(set) {


    currentSet =
        set;


    currentIndex =
        0;


    search.value =
        "";


    /*
     BOTONES
    */

    document
        .querySelectorAll(
            ".collection-btn"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.set ===
                    set

                );

            }
        );


    if (set === "ALL") {

        currentIcons =
            await loadAll();


        total.textContent =
            `${currentIcons.length} iconos`;

    }

    else {

        currentIcons =
            await loadSet(set);


        total.textContent =
            `${currentIcons.length} iconos`;

    }


    show();

}


/* =====================================================
   MOSTRAR
===================================================== */

function show() {


    if (
        !currentIcons.length
    ) {

        name.textContent =
            "Sin resultados";

        code.textContent =
            "";

        position.textContent =
            "0 / 0";

        return;

    }


    /*
     ELEMENTO ACTUAL
    */

    const item =
        currentIcons[
            currentIndex
        ];


    let setName;

    let iconName;


    /*
     TODAS
    */

    if (
        currentSet ===
        "ALL"
    ) {

        setName =
            item.set;

        iconName =
            item.name;

    }

    else {

        setName =
            currentSet;

        iconName =
            item;

    }


    /*
     ICONIFY
    */

    const fullName =
        `${setName}:${iconName}`;


    icon.setAttribute(
        "icon",
        fullName
    );


    /*
     TEXTO
    */

    name.textContent =
        iconName;


    code.textContent =
        fullName;


    /*
     FLAT / NORMAL
    */

    if (
        iconName.endsWith(
            "-flat"
        )
    ) {

        variant.textContent =
            "FLAT";

    }

    else {

        variant.textContent =
            "NORMAL";

    }


    /*
     POSICIÓN
    */

    position.textContent =
        `${currentIndex + 1} / ${currentIcons.length}`;


    /*
     INFO
    */

    info.textContent =
        `Colección: ${SETS[setName]?.name || setName} · ${iconName}`;

}


/* =====================================================
   SIGUIENTE
===================================================== */

function next() {


    if (
        !currentIcons.length
    )
        return;


    currentIndex =
        (
            currentIndex + 1
        )
        %
        currentIcons.length;


    show();

}


/* =====================================================
   ANTERIOR
===================================================== */

function previous() {


    if (
        !currentIcons.length
    )
        return;


    currentIndex =
        (
            currentIndex -
            1 +
            currentIcons.length
        )
        %
        currentIcons.length;


    show();

}


/* =====================================================
   ALEATORIO
===================================================== */

function randomIcon() {


    if (
        !currentIcons.length
    )
        return;


    currentIndex =
        Math.floor(

            Math.random()
            *
            currentIcons.length

        );


    show();

}


/* =====================================================
   BUSCAR
===================================================== */

async function doSearch() {


    const query =
        search.value
            .trim()
            .toLowerCase();


    if (!query) {

        changeCollection(
            currentSet
        );

        return;

    }


    if (
        currentSet ===
        "ALL"
    ) {

        const all =
            await loadAll();


        currentIcons =
            all.filter(
                item =>

                    item.name
                        .toLowerCase()
                        .includes(query)

            );

    }

    else {

        const icons =
            await loadSet(
                currentSet
            );


        currentIcons =
            icons.filter(
                iconName =>

                    iconName
                        .toLowerCase()
                        .includes(query)

            );

    }


    currentIndex =
        0;


    show();


    info.textContent =
        `${currentIcons.length} resultados para "${query}"`;

}


/* =====================================================
   COPIAR
===================================================== */

async function copyIcon() {


    if (
        !currentIcons.length
    )
        return;


    const item =
        currentIcons[
            currentIndex
        ];


    let fullName;


    if (
        currentSet ===
        "ALL"
    ) {

        fullName =
            `${item.set}:${item.name}`;

    }

    else {

        fullName =
            `${currentSet}:${item}`;

    }


    try {

        await navigator
            .clipboard
            .writeText(
                fullName
            );


        info.textContent =
            `✓ Copiado: ${fullName}`;

    }

    catch {

        info.textContent =
            fullName;

    }

}


/* =====================================================
   EVENTOS
===================================================== */


/*
 COLECCIONES
*/

document
    .querySelectorAll(
        ".collection-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    changeCollection(
                        button.dataset.set
                    );

                }
            );

        }
    );


/*
 BOTONES
*/

document
    .getElementById(
        "next"
    )
    ?.addEventListener(
        "click",
        next
    );


document
    .getElementById(
        "previous"
    )
    ?.addEventListener(
        "click",
        previous
    );


document
    .getElementById(
        "random"
    )
    .addEventListener(
        "click",
        randomIcon
    );


document
    .getElementById(
        "copy"
    )
    .addEventListener(
        "click",
        copyIcon
    );


/*
 BUSCADOR
*/

search.addEventListener(
    "input",
    doSearch
);


/*
 TECLADO
*/

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        )
            return;


        if (
            event.key ===
            "ArrowRight"
        ) {

            next();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previous();

        }


        if (
            event.key ===
            " "
        ) {

            event.preventDefault();

            next();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

changeCollection(
    "streamline-color"
);

</script>


</body>
</html>
