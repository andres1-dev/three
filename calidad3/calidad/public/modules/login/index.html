<!-- ============================================================
     modules/login/index.html — Fragmento del módulo Login
     Este archivo NO es una página completa. Lo carga el router
     de app.js cuando se navega a 'login', O bien se usa como
     contenido del login.html standalone de la raíz.
     ============================================================ -->

<div class="login-page" id="login-module-page">

    <div class="login-wrap">
        <div class="login-card">

            <!-- ── Header ── -->
            <div class="login-head">
                <img
                    src="icons/app.svg"
                    alt="Logo RRHH"
                    class="login-logo"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="login-logo-fallback" style="display:none">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <div class="login-title">RRHH Mobile</div>
                <div class="login-subtitle">Grupo TDM · Ingreso al sistema</div>
            </div>

            <!-- ── Formulario ── -->
            <div class="login-body">
                <form id="lf-form" novalidate>

                    <!-- Email / Usuario -->
                    <div class="lf-field">
                        <label class="lf-label" for="lf-email">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            Correo electrónico
                        </label>
                        <input
                            type="email"
                            id="lf-email"
                            class="lf-input"
                            placeholder="usuario@empresa.com"
                            autocomplete="email"
                            required
                            autofocus>
                    </div>

                    <!-- Contraseña -->
                    <div class="lf-field">
                        <label class="lf-label" for="lf-pass">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            Contraseña
                        </label>
                        <div class="lf-wrap">
                            <input
                                type="password"
                                id="lf-pass"
                                class="lf-input lf-input-pw"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required>
                            <button type="button" class="lf-pw-toggle" id="lf-pw-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                                <!-- Ojo abierto (default) -->
                                <svg id="lf-eye-icon" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Error box -->
                    <div class="lf-error" id="lf-error" role="alert">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span class="lf-error-txt" id="lf-error-txt"></span>
                    </div>

                    <!-- Botón submit -->
                    <button type="submit" class="lf-btn" id="lf-btn">
                        <svg viewBox="0 0 24 24" id="lf-btn-icon">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        <span id="lf-btn-txt">Iniciar sesión</span>
                    </button>

                    <!-- Recuperar contraseña -->
                    <button type="button" class="lf-forgot" id="lf-forgot">
                        ¿Olvidaste tu contraseña?
                    </button>

                </form>
            </div>

            <!-- ── Footer ── -->
            <div class="login-foot">
                <p class="login-foot-txt">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <polyline points="9 12 11 14 15 10"/>
                    </svg>
                    Conexión cifrada · Supabase Auth
                </p>
            </div>

        </div><!-- /.login-card -->
    </div><!-- /.login-wrap -->

</div><!-- /.login-page -->
