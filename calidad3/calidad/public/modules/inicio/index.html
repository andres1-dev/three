<div class="mod-inicio">

    <div class="feed-header">
        <img src="logo.png" alt="Logo" class="feed-logo" onerror="this.style.display='none'">
        <div class="feed-actions">
            <button class="icon-btn" aria-label="Historial">
                <svg viewBox="0 0 24 24" class="icon icon-md stroke-slate">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </button>
            <button class="icon-btn" aria-label="Calendario">
                <svg viewBox="0 0 24 24" class="icon icon-md stroke-slate">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>

            <button class="icon-btn" aria-label="Buscar">
                <svg viewBox="0 0 24 24" class="icon icon-md stroke-slate">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <button class="icon-btn" aria-label="Notificaciones">
                <svg viewBox="0 0 24 24" class="icon icon-md stroke-slate">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="feed-tabs">
        <button class="tab-btn active">Muro</button>
        <button class="tab-btn">Noticias</button>
    </div>

    <div class="feed-content">
        <article class="post-card">
            <div class="post-header">
                <img src="https://i.pravatar.cc/150?img=1" alt="Avatar" class="post-avatar">
                <div class="post-author">
                    <h3>ANDRES FELIPE GAVIRIA ALVAREZ</h3>
                    <span class="post-date">Sep 19, 2025</span>
                </div>
                <button class="post-menu" aria-label="Más opciones">⋯</button>
            </div>
            <div class="post-body">
                <p>Equipo Grupo TDM,</p>
                <p>En esta fecha tan especial de Amor y Amistad, queremos recordar que nuestros valores corporativos también son un reflejo de lo que somos cada día.</p>
                <button class="read-more">Ver más</button>
            </div>
            <div class="post-image">
                <img src="https://picsum.photos/seed/tdm/600/400" alt="Publicación">
            </div>
            <div class="post-reactions">
                <span class="reaction">❤️ 44</span>
                <span class="reaction">👍 16</span>
                <span class="reaction">😍 11</span>
                <span class="reaction">🥰 9</span>
                <span class="reaction">😀 8</span>
                <span class="reaction">🤗 2</span>
            </div>
            <button class="view-all-reactions">Ver todo</button>
        </article>
    </div>

    <button class="fab" aria-label="Nueva publicación">
        <svg viewBox="0 0 24 24" class="icon icon-md" style="stroke:white; stroke-width:2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
