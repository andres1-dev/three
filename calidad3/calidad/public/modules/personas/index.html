<div class="mod-personas">

    <!-- Header -->
    <div class="page-header">
        <h1 class="page-title">Personas</h1>
        <div class="feed-actions">
            <button class="icon-btn" id="p-btn-refresh" title="Actualizar">
                <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
        </div>
    </div>

    <!-- Tabs Empleados / Plantas -->
    <div class="p-tabs">
        <button class="p-tab active" data-tab="USERS" id="p-tab-users">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Empleados
        </button>
        <button class="p-tab" data-tab="PLANTS" id="p-tab-plants">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Talleres
        </button>
    </div>

    <!-- KPIs -->
    <div class="p-kpis" id="p-kpis">
        <div class="p-kpi">
            <span class="p-kpi-val" id="p-kpi-a">0</span>
            <span class="p-kpi-lbl" id="p-kpi-a-lbl">Pendientes</span>
        </div>
        <div class="p-kpi">
            <span class="p-kpi-val" id="p-kpi-b">0</span>
            <span class="p-kpi-lbl" id="p-kpi-b-lbl">Total</span>
        </div>
    </div>

    <!-- Búsqueda -->
    <div class="p-search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="p-search" placeholder="Buscar por nombre, ID o correo..." autocomplete="off">
    </div>

    <!-- Skeleton loading -->
    <div id="p-skeleton">
        <div class="p-skeleton-item"></div>
        <div class="p-skeleton-item"></div>
        <div class="p-skeleton-item"></div>
        <div class="p-skeleton-item"></div>
    </div>

    <!-- Lista -->
    <div id="p-list" style="display:none;"></div>

    <!-- Paginación -->
    <div class="p-pagination" id="p-pagination"></div>

    <!-- FAB nuevo -->
    <button class="p-fab" id="p-fab" title="Nuevo">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Sheet detalle / edición -->
    <div class="p-backdrop" id="p-backdrop"></div>
    <div class="p-sheet" id="p-sheet">
        <div class="p-sheet-handle"></div>
        <div id="p-sheet-body"></div>
    </div>

</div>
