<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <title>Liquidación Rodamiento - Grupo TDM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"
        media="print" onload="this.media='all'">
    <noscript>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    </noscript>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"
        media="print" onload="this.media='all'">
    <noscript>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    </noscript>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"
            rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" media="print"
        onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </noscript>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.3);
            --color-primary: #3f51b5;
            --border-radius: 16px;
        }

        body {
            padding-top: 0;
            background-attachment: fixed;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
        }

        .wrapper-dashboard {
            width: 96%;
            max-width: 1400px;
            margin: 80px auto 2rem;
            padding: 2rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
        }

        .liquidacion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }


        .periodo-selector {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .periodo-selector select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
        }

        .liquidacion-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }

        .liquidacion-table th,
        .liquidacion-table td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            text-align: center;
        }

        .liquidacion-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        .liquidacion-table .planta-name {
            text-align: left;
            font-weight: 500;
        }

        .liquidacion-table .total-row {
            background: #f1f5f9;
            font-weight: 700;
        }

        .liquidacion-table .visita-cell {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 600;
        }

        .liquidacion-table td svg {
            max-width: 140px;
            max-height: 48px;
            height: auto;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .liquidacion-table td svg path {
            stroke-width: 5px !important;
        }

        .firma-wrapper {
            position: relative;
            cursor: pointer;
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
            transition: all 0.2s;
        }

        .firma-wrapper::after {
            content: "\f00e";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            color: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            border-radius: 4px;
            font-size: 1.15rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
        }

        .firma-wrapper:hover::after {
            opacity: 1;
        }

        .coordenadas-link {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            text-decoration: none !important;
            transition: color 0.2s;
        }

        .coordenadas-link:hover {
            color: #3b82f6 !important;
            text-decoration: none !important;
        }

        .liquidacion-summary {
            background: var(--glass-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
        }

        .liquidacion-summary h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--color-primary);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primary);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 2px solid var(--color-primary);
        }

        .btn-generate {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-generate:hover {
            background: #303f9f;
            transform: translateY(-1px);
        }

        .btn-print {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-print:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        @media print {
            @page {
                size: letter landscape;
                margin: 0.5cm;
            }

            body {
                background: white !important;
                padding: 0 !important;
            }

            .wrapper-dashboard {
                margin: 0 !important;
                padding: 0.5cm !important;
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: none !important;
            }

            .btn-generate,
            .btn-print,
            .tabs-navigation,
            #descuentosInput {
                display: none !important;
            }

            .liq-tab-content {
                display: block !important;
                opacity: 1 !important;
                visibility: visible !important;
                page-break-after: always;
            }

            .liq-tab-content:last-child {
                page-break-after: auto;
            }

            .liquidacion-table {
                font-size: 0.7rem;
                width: 100%;
            }

            .liquidacion-table th,
            .liquidacion-table td {
                padding: 0.3rem;
                border: 1px solid #000;
            }

            .liquidacion-table td svg {
                max-width: 80px;
                max-height: 30px;
            }
        }

        @media (max-width: 768px) {
            .wrapper-dashboard {
                width: 100%;
                margin: 60px 0 1rem;
                padding: 1rem;
                border-radius: 0;
                box-shadow: none;
            }

            .liquidacion-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .periodo-selector {
                flex-direction: column;
                align-items: stretch;
            }

            .periodo-selector select,
            .periodo-selector input {
                width: 100%;
                font-size: 1rem;
                padding: 0.75rem;
            }

            .btn-generate,
            .btn-print {
                width: 100%;
                padding: 0.75rem;
                font-size: 1rem;
            }

            .liquidacion-table {
                font-size: 0.75rem;
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .liquidacion-table th,
            .liquidacion-table td {
                padding: 0.4rem;
                min-width: 80px;
            }

            .liquidacion-table td svg {
                max-width: 100px;
                max-height: 40px;
            }

            .liquidacion-summary {
                padding: 1rem;
            }

            .liquidacion-summary h3 {
                font-size: 1rem;
            }

            .summary-row {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .liquidacion-table {
                font-size: 0.65rem;
            }

            .liquidacion-table th,
            .liquidacion-table td {
                padding: 0.3rem;
                min-width: 60px;
            }

            .liquidacion-table td svg {
                max-width: 80px;
                max-height: 32px;
            }

            .liquidacion-table .planta-name {
                min-width: 100px;
            }
        }
    </style>
</head>

<body>
    <app-top-nav></app-top-nav>

    <div class="wrapper-dashboard">
        <div class="liquidacion-header">
            <div class="periodo-selector">
                <select id="mesSelector">
                    <option value="0">Enero</option>
                    <option value="1">Febrero</option>
                    <option value="2">Marzo</option>
                    <option value="3">Abril</option>
                    <option value="4">Mayo</option>
                    <option value="5">Junio</option>
                    <option value="6">Julio</option>
                    <option value="7">Agosto</option>
                    <option value="8">Septiembre</option>
                    <option value="9">Octubre</option>
                    <option value="10">Noviembre</option>
                    <option value="11">Diciembre</option>
                </select>
                <select id="anioSelector">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
                <select id="quincenaSelector">
                    <option value="1">1-15</option>
                    <option value="2">16-Último</option>
                </select>
                <input type="text" id="descuentosInput" placeholder="Descontar días..." style="max-width: 160px; font-size: 0.9rem; padding: 0.5rem 1rem; border: 1px solid var(--color-border); border-radius: 8px; background: white; cursor: pointer;">
                <button class="btn-generate" onclick="generarLiquidacion()">
                    <i class="fas fa-calculator"></i> Generar
                </button>
                <button class="btn-print" onclick="enviarLiquidacion()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                    <i class="fas fa-paper-plane"></i> Enviar
                </button>
                <button class="btn-print" onclick="imprimirLiquidacion()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>

        <div id="liquidacionContainer">
            <p style="text-align: center; color: #64748b; padding: 2rem;">
                Selecciona el periodo y haz clic en "Generar" para ver la liquidación.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin/liquidacion-rodamiento.js"></script>
</body>

</html>
